name: Linux build

# The Linux input method on a real Linux: what the maintainer's Mac cannot
# prove (docs/architecture/linux-roadmap.md L12). Builds both workspaces the
# engine links, runs the Linux workspace's tests, and smokes the engine
# against a real ibus-daemon — the daemon must be able to spawn the binary
# from the component XML and complete `CreateEngine`, which is the wire's
# first byte-level contract. Nothing here publishes; the release half
# (a `.deb` on the desktop draft) lands with the packaging PR.
#
# On a release publish (the `desktop-<version>` tag) and on a dispatch from
# `scripts/stage-desktop.sh`, the run also packs the `.deb` and attaches it
# to the draft — the Linux half of a desktop release, the way
# `windows-build.yml` is the Windows half.
#
# Budget: ~4 min warm, ~10 min cold (dependency compile + apt).
on:
  # A publish rebuilds for provenance and keeps the artifact; it never
  # touches the published assets (`desktop-release.md`: what was tested is
  # what ships).
  release:
    types: [published]
  pull_request:
    paths:
      - 'linux/**'
      - 'desktop/**'
      - 'engine/**'
      - 'dictionaries/**'
      - '.github/workflows/linux-build.yml'
  push:
    branches: [main]
    paths:
      - 'linux/**'
      - 'desktop/**'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: The commit stage-desktop.sh staged; the attach step refuses any other
        required: false
        type: string

# Every job reads; only `attach` writes (its own block below).
permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same pin as engine.yml: engine/protos/build.rs shells out to protoc.
  PROTOC_VERSION: 36.1
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build + test + ibus smoke
    runs-on: ubuntu-24.04
    # Only the desktop train: a mobile publish has no Linux package in it.
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'desktop-')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ibus dbus-daemon xvfb libgtk-4-dev libadwaita-1-dev pkg-config \
            fcitx5 fcitx5-modules-dev extra-cmake-modules cmake ninja-build dpkg-dev desktop-file-utils

      - name: Install protoc ${{ env.PROTOC_VERSION }}
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            linux -> target
            desktop -> target

      - name: cargo clippy (linux workspace)
        working-directory: linux
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Under xvfb: the settings crate's pane-mount test needs a display and
      # skips itself without one.
      - name: cargo test (linux workspace)
        working-directory: linux
        env:
          # The pane-mount test must run here, never skip: a display exists.
          TAIGI_REQUIRE_DISPLAY: "1"
        run: xvfb-run -a cargo test --workspace

      - name: cargo build --release (IBus engine + FFI static library)
        working-directory: linux
        run: cargo build --release -p taigikeyboard-ibus -p taigi-linux-ffi

      # The Fcitx5 addon: the only place it compiles before a Linux VM does.
      - name: cmake (Fcitx5 addon)
        working-directory: linux
        run: |
          cmake -S fcitx5 -B target/fcitx5-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DTAIGI_FFI_LIB="$PWD/target/release/libtaigi_linux_ffi.a"
          cmake --build target/fcitx5-build
          test -f target/fcitx5-build/src/libtaigikeyboard.so
          nm -D --defined-only target/fcitx5-build/src/libtaigikeyboard.so | grep -q fcitx_addon_factory_instance

      - name: cargo fmt --check
        working-directory: linux
        run: cargo fmt -- --check

      # The daemon smoke: install the engine into a throwaway prefix, point
      # ibus-daemon at that component directory, and ask it to list and
      # select the engine. `ibus engine taigikeyboard` returns only once the
      # daemon has spawned the binary and CreateEngine has answered.
      - name: ibus-daemon smoke
        working-directory: linux
        run: |
          set -euxo pipefail
          PREFIX="$RUNNER_TEMP/prefix"
          make install PREFIX="$PREFIX" DESTDIR=""
          test -f "$PREFIX/share/fcitx5/addon/taigikeyboard.conf"
          # The addon file the loader will look for (5.1.7 addonloader.cpp:
          # `Library=export:libX` → `libX.so`) must be the one installed.
          library="$(sed -n 's/^Library=export:\(.*\)$/\1/p' "$PREFIX/share/fcitx5/addon/taigikeyboard.conf")"
          test -n "$library"
          ls "$PREFIX"/lib/fcitx5/"$library".so "$PREFIX"/lib/*/fcitx5/"$library".so 2>/dev/null | grep -q . || { echo "::error::no $library.so under $PREFIX/lib — the addon .conf and the CMake target disagree"; exit 1; }
          desktop-file-validate "$PREFIX/share/applications/tw.taigikeyboard.Settings.desktop"
          export IBUS_COMPONENT_PATH="$PREFIX/share/ibus/component"
          export TAIGIKEYBOARD_DATA_DIR="$GITHUB_WORKSPACE"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          export RUST_LOG=debug
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          xvfb-run -a dbus-run-session -- bash -c '
            set -euxo pipefail
            # No config module on a runner (no dconf / memconf): `--config disable`
            # keeps the daemon up; `--panel disable` likewise.
            ibus-daemon --verbose --panel disable --config disable > "$RUNNER_TEMP/ibus-daemon.log" 2>&1 &
            DAEMON=$!
            # The daemon writes its socket file once its bus is up.
            for i in $(seq 1 40); do ibus list-engine > /dev/null 2>&1 && break; sleep 0.5; done
            ibus list-engine | tee "$RUNNER_TEMP/engines.txt"
            grep -q taigikeyboard "$RUNNER_TEMP/engines.txt"
            ibus engine taigikeyboard
            sleep 2
            ibus engine | tee "$RUNNER_TEMP/current.txt"
            grep -q taigikeyboard "$RUNNER_TEMP/current.txt"
            kill "$DAEMON" || true
          '

      # The package, from the same install layout the smoke used, then read
      # back: a `.deb` that lists the addon, the engine, the window, the
      # registration files and the dictionaries.
      - name: Build the .deb
        working-directory: linux
        run: |
          set -euo pipefail
          make deb
          dpkg-deb --contents target/taigikeyboard_*_amd64.deb | tee "$RUNNER_TEMP/deb-contents.txt"
          for path in usr/libexec/ibus-engine-taigikeyboard usr/bin/taigikeyboard-settings \
                      fcitx5/libtaigikeyboard.so usr/share/fcitx5/addon/taigikeyboard.conf \
                      usr/share/fcitx5/inputmethod/taigikeyboard.conf usr/share/ibus/component/taigikeyboard.xml \
                      usr/share/taigikeyboard/dictionaries/dictionary.fst usr/share/applications/tw.taigikeyboard.Settings.desktop \
                      usr/share/icons/hicolor/48x48/apps/taigikeyboard.png; do
            grep -q "$path" "$RUNNER_TEMP/deb-contents.txt" || { echo "::error::$path missing from the .deb"; exit 1; }
          done
          cd target && sha256sum taigikeyboard_*_amd64.deb | tee SHA256SUMS

      - name: Upload the .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb
          path: |
            linux/target/taigikeyboard_*_amd64.deb
            linux/target/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Show daemon log on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/ibus-daemon.log" 2>/dev/null || true
          ls -la "$RUNNER_TEMP" || true

  # The release half: only a dispatch from `main` by `stage-desktop.sh`
  # attaches, onto a DRAFT, never over an asset already there — what the
  # maintainer tests on the draft is what a publish ships. The only job
  # that can write.
  attach:
    name: attach to the draft
    needs: build
    if: >-
      github.repository == 'taigikeyboard/taigikeyboard' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: linux/target

      - name: Attach the .deb to the draft release
        working-directory: linux
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # The commit the staging run meant, not whatever main points at
          # by the time this run started: main can move while the Windows
          # half is waited on.
          if [ -n "$SOURCE_SHA" ] && [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::this run built $GITHUB_SHA but the staging run staged $SOURCE_SHA — main moved; re-run stage-desktop.sh"
              exit 1
          fi
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag="desktop-$version"
          state="$(gh release view "$tag" --json isDraft --jq '.isDraft|tostring' 2>&1)" || {
              echo "no release $tag: $state" >&2
              echo "The macOS half stages first and creates the draft." >&2
              exit 1
          }
          [ "$state" = true ] || {
              echo "$tag is already published — an asset added now would be public with no test" >&2
              exit 1
          }
          cd target
          package="taigikeyboard_${version}_amd64.deb"
          [ -f "$package" ] || { echo "no $package in $(pwd)" >&2; exit 1; }
          printf '%s  %s\n' "$(sha256sum "$package" | cut -d' ' -f1)" "$package" > "$package.sha256"
          gh release upload "$tag" "$package" "$package.sha256" --repo "$GITHUB_REPOSITORY"
          echo "attached $package to $tag (built from $GITHUB_SHA)"
