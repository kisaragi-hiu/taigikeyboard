[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "minimal"
# Both macOS architectures are shipped ABIs: the input method is one universal
# `.pkg` (docs/architecture/macos-release.md), and
# engine/scripts/build-macos-xcframework.sh builds this workspace for each.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
