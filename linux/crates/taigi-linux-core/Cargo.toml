[package]
name = "taigi-linux-core"
description = "The framework-independent half of the Linux input method: runtime (settings, stores, lexicon, coordinator), the key path, the effect model both shells replay, the candidate page model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
taigi-desktop-core.workspace = true
taigi-desktop-storage.workspace = true
taigi-linux-platform.workspace = true
log.workspace = true
dispatch = { workspace = true, optional = true }

[features]
# Test-build-only trace — docs/architecture/e2e-trace-schema.md.
e2e-trace = ["dep:dispatch", "dispatch/e2e-trace"]
# Compile out all Linux update-check entry points.
disable-updates = []

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
