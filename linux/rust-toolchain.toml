[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "minimal"
# x86_64-unknown-linux-gnu — the shipping target; `make linux-check` on the
# macOS host `cargo check`s the engine + platform crates for it (no linker
# needed). The settings crate (GTK) is checked natively on the host instead
# (docs/architecture/linux-roadmap.md L12).
targets = ["x86_64-unknown-linux-gnu"]
