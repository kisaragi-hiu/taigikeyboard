[package]
name = "taigi-windows-update"
description = "Windows update download, verification, toast and the two-stage install offer — port of the macOS UpdateInstallation / UpdatePackageVerifier over taigi-desktop-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
taigi-desktop-core.workspace = true
taigi-desktop-update.workspace = true
taigi-windows-platform.workspace = true
log.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Data_Xml_Dom",
    "UI_Notifications",
] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# JUSTIFICATION: Authenticode (`WinVerifyTrust` + CryptoAPI) and VERSIONINFO
# are raw Win32; each `unsafe` block is one call sequence with a `// SAFETY:`
# line, confined to `verify.rs`. Every other module is safe Rust.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
