<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TaigiKeyboard Film</title>
<style>
@font-face { font-family: Huninn; src: url(assets/jf_openhuninn_2_1.ttf); }
@font-face { font-family: GenMin; src: url(assets/genyomin2tw_r.otf); }
@font-face { font-family: GenGo; src: url(assets/genyogothic2tw_r.otf); }
:root {
  --ink: #1d1d1f;
  --ink2: #86868b;
  --ink3: #a1a1a6;
  --accent: #0071e3;
  --bg: #fbfbfd;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }
.center { position: absolute; left: 50%; top: 50%; }
.sf { font-family: "SF Pro Display", "SF Pro Text", -apple-system, sans-serif; }

/* hero typing */
.label { position: absolute; left: 0; right: 0; text-align: center; top: 300px;
  font: 500 24px "SF Pro Display", sans-serif; letter-spacing: .42em; color: var(--ink2); text-indent: .42em; }
.hero { position: absolute; left: 0; right: 0; top: 476px; height: 150px; text-align: center; transform-origin: 50% 50%; }
.line { display: inline-block; position: relative; font-family: Huninn; color: var(--ink); white-space: pre; line-height: 150px; }
.cl { display: inline-block; position: relative; }
.cl .sz { visibility: hidden; }
.cl span.l { position: absolute; left: 0; top: 0; }
.caret { position: absolute; top: 34px; width: 4px; height: 94px; border-radius: 2px; background: var(--accent); }
.uline { position: absolute; top: 128px; height: 3px; border-radius: 2px; background: #c7c7cc; left: 0; }
.hanji { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font-family: GenMin; color: var(--ink); white-space: nowrap; }
.keys { position: absolute; left: 50%; top: 760px; width: 0; height: 0; }
.cap { position: absolute; left: -34px; top: 0; width: 68px; height: 76px; border-radius: 13px; background: #fff;
  box-shadow: 0 1px 0 rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.06); display: flex; align-items: center; justify-content: center;
  font-family: Huninn; font-size: 36px; color: var(--ink); }
.cap .mk { position: absolute; top: 2px; left: 0; right: 0; text-align: center; font-size: 26px; color: var(--accent); }
.cap.tone .d { margin-top: 10px; }

/* triptych */
.tri-h { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font: 150px GenMin; color: var(--ink); }
.tri-row { position: absolute; left: 0; right: 0; height: 90px; display: flex; justify-content: center; align-items: baseline; }
.tri-row .k { width: 150px; text-align: right; padding-right: 44px; font: 500 22px "SF Pro Display"; letter-spacing: .3em; color: var(--ink2); }
.tri-row .v { width: 760px; font: 62px Huninn; color: var(--ink); white-space: pre; }
.tri-row .v span { transition: none; }

/* phone */
#phone { position: absolute; left: 50%; top: 50%; width: 486px; height: 1000px; margin-left: -243px; margin-top: -500px; }
.bezel { position: absolute; inset: 0; border-radius: 76px; background: #111113;
  box-shadow: 0 0 0 2px #2c2c2e inset, 0 50px 120px rgba(0,0,0,.18), 0 12px 32px rgba(0,0,0,.12); }
.screen { position: absolute; left: 13px; top: 13px; right: 13px; bottom: 13px; border-radius: 64px; overflow: hidden; background: #fff; }
.island { position: absolute; left: 50%; top: 14px; width: 118px; height: 34px; margin-left: -59px; border-radius: 17px; background: #000; z-index: 5; }
.status { position: absolute; top: 20px; left: 44px; right: 40px; font: 600 17px "SF Pro Text", "SF Pro Display"; color: #000; display: flex; justify-content: space-between; }
.kb { position: absolute; left: 0; right: 0; bottom: 0; }
.kbbg { position: absolute; inset: 0; }
.field { position: absolute; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.plus { width: 40px; height: 40px; border-radius: 50%; background: #efeff2; display: flex; align-items: center; justify-content: center; }
.pill { flex: 1; height: 42px; border-radius: 21px; background: #ececee; position: relative; display: flex; align-items: center; padding: 0 44px 0 16px;
  font: 22px Huninn; color: #111; white-space: nowrap; overflow: hidden; }
.send { width: 40px; height: 40px; border-radius: 50%; background: #5b6cf6; display: flex; align-items: center; justify-content: center; }
.fcaret { display: inline-block; width: 2px; height: 26px; background: #0a84ff; vertical-align: middle; margin-left: 1px; }
.comp { border-bottom: 2px solid #9a9aa0; padding-bottom: 1px; }
.cbar { position: absolute; left: 0; right: 0; height: 64px; display: flex; align-items: center; overflow: hidden; font-family: Huninn; }
.cbar .cplus { width: 40px; flex: none; text-align: center; font-size: 30px; font-weight: 300; }
.cands { flex: 1; position: relative; height: 64px; overflow: hidden; }
.crow { position: absolute; left: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip { height: 38px; border-radius: 10px; padding: 0 12px; display: flex; align-items: center; font-size: 24px; }
.cell { padding: 0 11px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.cell .h { font-size: 26px; }
.cell .r { font-size: 16px; margin-top: 5px; opacity: .55; }
.chev { width: 52px; flex: none; height: 40px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(0,0,0,.13); }
.keyarea { position: absolute; left: 0; right: 0; }
.key { position: absolute; display: flex; align-items: center; justify-content: center; font-family: Huninn; }
.key .tm { position: absolute; left: 0; right: 0; text-align: center; }
.callout { position: absolute; border-radius: 12px; display: flex; align-items: flex-start; justify-content: center; font-family: Huninn; z-index: 4; }
.tap { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(60,60,67,.22); z-index: 6; }
.sysrow { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; }
.homebar { position: absolute; left: 50%; bottom: 9px; width: 150px; height: 5px; margin-left: -75px; border-radius: 3px; background: #000; }

/* platforms + end */
.plat { position: absolute; left: 0; right: 0; top: 505px; text-align: center; font: 500 46px "SF Pro Display"; color: var(--ink); letter-spacing: .01em; }
.plat span { display: inline-block; margin: 0 30px; }
.icon { position: absolute; left: 50%; top: 50%; border-radius: 22.37%; overflow: hidden; background: #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 24px 60px rgba(0,0,0,.10), 0 6px 16px rgba(0,0,0,.06); }
.icon img { width: 100%; height: 100%; display: block; }
.brand { position: absolute; left: 0; right: 0; text-align: center; }

/* macOS desktop (logical points) */
.mac { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; overflow: hidden; border-radius: 0; }
.wall { position: absolute; inset: 0; background: radial-gradient(120% 90% at 20% 10%, #eef1f8 0%, #dfe5f1 45%, #cfd8ea 100%); }
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: rgba(255,255,255,.35); backdrop-filter: blur(20px);
  font: 500 13px "SF Pro Text", "SF Pro Display"; color: #1d1d1f; }
.mb-r { position: absolute; right: 16px; top: 0; height: 30px; display: flex; align-items: center; gap: 16px; }
.mb-ime { width: 22px; height: 16px; filter: brightness(0); opacity: .85; }
.mwin { position: absolute; left: 250px; top: 110px; width: 940px; height: 600px; border-radius: 26px; background: #fff;
  box-shadow: 0 0 0 .5px rgba(0,0,0,.14), 0 28px 70px rgba(30,40,70,.22), 0 6px 18px rgba(30,40,70,.10); overflow: hidden; }
.mtitle { height: 52px; display: flex; align-items: center; gap: 9px; padding-left: 20px; }
.tl { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
.tl.r { background: #ff5f57; } .tl.y { background: #febc2e; } .tl.g { background: #28c840; }
.mdoc { position: absolute; left: 64px; top: 92px; right: 64px; font: 22px "SF Pro Text", "SF Pro Display", "PingFang TC", sans-serif; color: #1d1d1f; white-space: pre; }
.mcomp { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
.mcaret { display: inline-block; width: 2px; height: 26px; background: #1d1d1f; vertical-align: -5px; margin-left: 1px; }
.mpanel { position: absolute; left: 306px; top: 238px; border-radius: 16px; padding: 4px;
  background: rgba(250,250,252,.82); backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.16), inset 0 0 0 1px rgba(255,255,255,.6), 0 12px 36px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.08);
  font-family: "SF Pro Text", "SF Pro Display", "PingFang TC", sans-serif; color: #1d1d1f; }
.mrow { display: flex; align-items: stretch; }
.mcell { display: flex; align-items: center; gap: 2px; padding: 9px 7px; border-radius: 12px; white-space: nowrap; }
.mcell.lit { color: #1d1d1f; font-size: 17px; }
.mcell .ix { font-size: 11px; color: rgba(60,60,67,.55); align-self: flex-start; margin-top: 3px; min-width: 13px; text-align: center; }
.mcell .st { display: flex; flex-direction: column; align-items: flex-start; }
.mcell .h { font-size: 17px; line-height: 21px; }
.mcell .r { font-size: 15px; line-height: 18px; margin-top: 2px; color: rgba(60,60,67,.62); }
.mcell.on { background: #0088ff; color: #fff; }
.mcell.on .ix, .mcell.on .r { color: rgba(255,255,255,.85); }
.msep { width: 1px; margin: 9px 0; background: rgba(0,0,0,.09); }
.mcell.on + .msep, .msep:has(+ .mcell.on) { opacity: 0; }
.mchev { display: flex; align-items: center; padding: 0 9px 0 7px; color: rgba(60,60,67,.6); }
.mkeys { top: 900px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eOut5 = p => 1 - Math.pow(1 - p, 5);
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const eBack = p => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')})`; };
const mixA = (a, b, p, alpha) => { const A = hex(a), B = hex(b); return `rgba(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')},${alpha})`; };

const stage = document.getElementById('stage');
const EVENTS = []; // sound cues: {t, type, ...}
const scenes = [];
const DURATION = 44.5;

// fade a whole layer in/out with blur and drift
function presence(el, t, tin, tout, opts = {}) {
  const dIn = opts.dIn ?? .9, dOut = opts.dOut ?? .8, rise = opts.rise ?? 24, blur = opts.blur ?? 14;
  const pi = eOut(seg(t, tin, tin + dIn));
  const po = eIO(seg(t, tout, tout + dOut));
  const o = pi * (1 - po);
  el.style.opacity = o;
  el.style.display = o <= 0.001 ? 'none' : '';
  const y = (1 - pi) * rise - po * (opts.riseOut ?? rise * .6);
  const s = lerp(opts.scaleIn ?? 1, 1, pi) * lerp(1, opts.scaleOut ?? 1, po);
  el.style.transform = `translateY(${y}px) scale(${s})`;
  const b = (1 - pi) * blur + po * blur;
  el.style.filter = b > .05 ? `blur(${b}px)` : 'none';
  return o;
}

// ---------- Scene A: icon open ----------
(function () {
  const L = $('div', 'layer', stage);
  const ic = $('div', 'icon', L, '<img src="assets/icon.png">');
  const S = 230; Object.assign(ic.style, { width: S + 'px', height: S + 'px', marginLeft: -S / 2 + 'px', marginTop: -S / 2 + 'px' });
  EVENTS.push({ t: 0.35, type: 'bloom', level: .7 });
  scenes.push(t => {
    const o = presence(L, t, 0.3, 2.3, { dIn: 1.4, dOut: .75, rise: 0, blur: 18, scaleIn: .9, scaleOut: 1.06 });
    if (o) ic.style.transform = `scale(${lerp(1, 1.025, seg(t, .35, 2.6))})`;
  });
})();

// ---------- typing scenes ----------
const MARKS = { '2': 'ˊ', '3': 'ˋ', '5': 'ˆ', '6': 'ˇ', '7': 'ˉ', '8': 'ˈ', '9': '˝' };
function typingScene(o) {
  const L = $('div', 'layer', stage);
  const label = $('div', 'label', L, o.label);
  const hero = $('div', 'hero', L);
  const line = $('div', 'line', hero);
  line.style.fontSize = o.size + 'px';
  if (o.spacing) line.style.letterSpacing = o.spacing;
  const hanji = $('div', 'hanji', L, o.hanji);
  hanji.style.fontSize = o.hanjiSize + 'px';
  const keysEl = $('div', 'keys', L);

  // timeline of keystrokes
  const r = rng(o.seed);
  let t = o.tType;
  const clusters = [], keys = [];
  for (const st of o.steps) {
    const gap = (st.pauseBefore || 0);
    t += gap;
    keys.push({ t, label: st.k, tone: !!st.tone, mk: st.tone ? (st.keyMark ?? MARKS[st.k]) : null });
    if (st.add != null) clusters.push({ pre: st.add, fin: st.add, tA: t, tM: null, gapAfter: st.gapAfter || 0 });
    if (st.mark) { const c = clusters[clusters.length + st.mark.at]; c.fin = st.mark.g; c.tM = t; }
    EVENTS.push({ t, type: st.tone ? 'tonekey' : 'key', v: r() });
    if (st.mark) EVENTS.push({ t: t + .2, type: 'chime', note: st.note ?? 0, level: .55 });
    t += o.beat * (0.78 + r() * 0.5);
  }
  const tDone = t;
  // DOM for clusters
  const cls = clusters.map(c => {
    const s = $('span', 'cl', line);
    $('span', 'sz', s, c.fin === ' ' ? ' ' : c.fin);
    const pre = $('span', 'l', s, c.pre === ' ' ? ' ' : c.pre);
    let fin = null, mk = null;
    if (c.tM != null) { fin = $('span', 'l', s, c.fin); mk = $('span', 'l', s, c.fin); }
    if (c.gapAfter) s.style.marginRight = c.gapAfter;
    return { c, s, pre, fin, mk };
  });
  const caret = $('div', 'caret', line);
  const ul = $('div', 'uline', line);
  const caps = keys.map(k => {
    const e = $('div', 'cap' + (k.tone ? ' tone' : ''), keysEl);
    if (k.tone && k.mk) { $('div', 'mk', e, k.mk); $('div', 'd', e, k.label); }
    else e.textContent = k.label === ' ' ? '' : k.label;
    if (k.label === ' ') e.style.width = '150px', e.style.left = '-75px';
    if (o.tps) e.style.fontSize = '34px';
    return e;
  });

  let measured = false, xs = [], zone = 0;
  function measure() {
    const lr = line.getBoundingClientRect();
    xs = cls.map(q => { const b = q.s.getBoundingClientRect(); return { x0: (b.left - lr.left) / 1, x1: (b.right - lr.left) }; });
    // mark zone height: above x-height (latin) / above glyph top (TPS)
    const cv = document.createElement('canvas').getContext('2d');
    cv.font = `${o.size}px Huninn`;
    const m = cv.measureText(o.tps ? 'ㆷ' : 'x');
    const A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent;
    const base = (150 - (A + D)) / 2 + A;
    zone = base - m.actualBoundingBoxAscent - o.size * 0.035;
    cls.forEach(q => { if (q.mk) q.mk.style.clipPath = `inset(-60% -40% calc(100% - ${zone}px) -40%)`; });
    measured = true;
  }

  const tRev = o.tReveal;
  if (o.hanji) EVENTS.push({ t: tRev, type: 'reveal', level: .8 });
  EVENTS.push({ t: o.tIn, type: 'whoosh', level: .35 });

  scenes.push(tt => {
    const vis = presence(L, tt, o.tIn, o.tOut, { dIn: .7, dOut: .8, rise: 0, blur: 16 });
    if (!vis) return;
    if (!measured) measure();
    // label
    const pl = eOut(seg(tt, o.tIn + .1, o.tIn + 1.1));
    label.style.opacity = pl * (1 - eIO(seg(tt, tRev, tRev + .6)) * .0);
    label.style.transform = `translateY(${(1 - pl) * 10}px)`;
    // clusters
    let last = -1;
    cls.forEach((q, i) => {
      const a = eOut(seg(tt, q.c.tA - .02, q.c.tA + .16));
      if (tt >= q.c.tA - .02) last = i;
      q.s.style.opacity = a;
      q.s.style.transform = `translateY(${(1 - a) * 16}px)`;
      q.s.style.filter = a < .999 ? `blur(${(1 - a) * 6}px)` : 'none';
      if (q.c.tM != null) {
        const p = seg(tt, q.c.tM, q.c.tM + .34);
        const land = seg(tt, q.c.tM + .3, q.c.tM + .38);
        const fall = eOut5(p);
        q.mk.style.opacity = p > 0 ? (1 - land) * clamp(p * 4) : 0;
        q.mk.style.transform = `translateY(${-(1 - fall) * o.size * .55}px)`;
        q.mk.style.color = mix('#0071e3', '#1d1d1f', seg(tt, q.c.tM + .3, q.c.tM + 1.1));
        q.fin.style.opacity = land;
        q.fin.style.color = mix('#0071e3', '#1d1d1f', eIO(seg(tt, q.c.tM + .3, q.c.tM + 1.1)));
        q.pre.style.opacity = 1 - land;
      }
    });
    // caret + composing underline
    const rev = eIO(seg(tt, tRev, tRev + 1.0));
    let cx = 0;
    if (last >= 0) {
      // slide caret smoothly from previous cluster end
      const q = cls[last];
      const prevX = last > 0 ? xs[last - 1].x1 : xs[0].x0;
      cx = lerp(prevX, xs[last].x1, eOut(seg(tt, q.c.tA - .02, q.c.tA + .08)));
    } else cx = xs.length ? xs[0].x0 : 0;
    const blink = tt < tDone + .25 ? 1 : (Math.cos((tt - tDone - .25) * Math.PI * 2 / 1.06) > -0.1 ? 1 : 0);
    caret.style.left = (cx + 3) + 'px';
    { const x0 = xs[0].x0, full = xs[xs.length - 1].x1 - x0; line.style.transform = `translateX(${(full - (cx - x0)) / 2}px)`; }
    caret.style.opacity = seg(tt, o.tIn + .2, o.tIn + .6) * blink * (1 - seg(tt, tRev, tRev + .25));
    ul.style.left = (xs.length ? xs[0].x0 : 0) + 'px';
    ul.style.width = Math.max(0, cx - (xs.length ? xs[0].x0 : 0)) + 'px';
    ul.style.opacity = (last >= 0 ? 1 : 0) * (1 - seg(tt, tRev, tRev + .4));
    // reveal: roman becomes the subtitle under the Hanji (candidate-cell shape)
    const sc = lerp(1, o.subScale, rev);
    hero.style.transform = `translateY(${rev * o.subDrop}px) scale(${sc})`;
    line.style.color = mix('#1d1d1f', '#86868b', rev);
    const ph = eOut(seg(tt, tRev + .12, tRev + 1.3));
    hanji.style.opacity = ph;
    hanji.style.transform = `translateY(${(1 - ph) * 30}px)`;
    hanji.style.filter = ph < .999 ? `blur(${(1 - ph) * 16}px)` : 'none';
    hanji.style.letterSpacing = lerp(.22, .06, eOut(seg(tt, tRev + .12, tRev + 2.2))) + 'em';
    hanji.style.textIndent = lerp(.22, .06, eOut(seg(tt, tRev + .12, tRev + 2.2))) + 'em';
    // keycap conveyor
    const kv = 1 - eIO(seg(tt, tRev - .1, tRev + .5));
    keysEl.style.opacity = kv;
    let shift = 0; keys.forEach((k, i) => { if (i) shift += eOut(seg(tt, k.t, k.t + .22)); }); shift = Math.min(shift, 3.2) / 2;
    keys.forEach((k, i) => {
      const e = caps[i];
      let n = 0;
      for (let j = i + 1; j < keys.length; j++) n += eOut(seg(tt, keys[j].t, keys[j].t + .22));
      const a = seg(tt, k.t - .01, k.t + .12);
      const press = seg(tt, k.t, k.t + .09), rel = seg(tt, k.t + .09, k.t + .3);
      const s = (0.85 + 0.15 * eBack(a)) * (1 - 0.06 * press + 0.06 * eOut(rel));
      const fade = 1 - clamp((n - 3.2) / 1.6);
      e.style.opacity = eOut(a) * fade * (k.label === ' ' ? 1 : 1);
      e.style.display = e.style.opacity > 0.001 ? '' : 'none';
      const w = 84;
      e.style.transform = `translateX(${(-n + shift) * w}px) scale(${s})`;
      e.style.background = mix('#ffffff', '#e8e8ed', press * (1 - rel));
    });
  });
  return { tDone };
}

// ---- Scene B: TL — tâi-gí tsin-suí / 台語真媠 ----
const tl = typingScene({
  label: 'TL', seed: 7, size: 124, hanjiSize: 176, subScale: .44, subDrop: 138,
  tIn: 2.75, tType: 3.35, beat: .15, tReveal: 7.05, tOut: 9.3,
  hanji: '台語真媠',
  steps: [
    { k: 't', add: 't' }, { k: 'a', add: 'a' }, { k: 'i', add: 'i' },

      tap.style.opacity = Math.sin(tp * Math.PI) * .9;
      tap.style.transform = `scale(${.7 + .5 * eOut(tp)})`;
    } else tap.style.display = 'none';
  });
})();

// ---------- Scene G: the Mac ----------
(function () {
  const L = $('div', 'layer', stage);
  const tIn = 32.75, tOut = 40.0;
  // logical macOS desktop in points; the camera maps it onto the 1920×1080 frame
  const D = $('div', 'mac', L);
  $('div', 'wall', D);
  const menubar = $('div', 'menubar', D, '<span class="mb-r"><img src="assets/menubar.png" class="mb-ime"><span>Mon 9:41</span></span>');
  const win = $('div', 'mwin', D);
  $('div', 'mtitle', win, '<span class="tl r"></span><span class="tl y"></span><span class="tl g"></span>');
  const doc = $('div', 'mdoc', win);
  const docText = $('span', null, doc);
  const mcaret = $('span', 'mcaret', doc);
  const panel = $('div', 'mpanel', D);
  const keysEl = $('div', 'keys mkeys', L);

  // real engine output (candidate_dump, mode=tl) per prefix of "tai5gi2tsin1sui2":
  // [literal, keyed…] — the literal lead cell is unkeyed, keys follow q w d f z x
  const DUMP = {
    't': ['t', ['佇', 'tī'], ['台', 'tâi'], ['就', 'tō'], ['代', 'tāi'], ['大', 'tāi'], ['地', 'tē']],
    'ta': ['ta', ['乾', 'ta'], ['凋', 'ta'], ['焦', 'ta'], ['大', 'ta'], ['罩', 'tà'], ['礁', 'ta']],
    'tai': ['tai', ['台', 'tâi'], ['代', 'tāi'], ['大', 'tāi'], ['臺', 'tâi'], ['帶', 'tài'], ['事', 'tāi']],
    'tai5': ['tâi', ['台', 'tâi'], ['臺', 'tâi'], ['𧉟', 'tâi'], ['抬', 'tâi'], ['枱', 'tâi'], ['駘', 'tâi']],
    'tai5g': ['tai5g', ['台', 'tâi'], ['臺', 'tâi'], ['𧉟', 'tâi'], ['抬', 'tâi'], ['枱', 'tâi'], ['駘', 'tâi']],
    'tai5gi': ['tai5gi', ['台語', 'tâi-gí'], ['臺語', 'tâi-gí'], ['台', 'tâi'], ['臺', 'tâi'], ['𧉟', 'tâi'], ['抬', 'tâi']],
    'tai5gi2': ['tai5gi2', ['台語', 'tâi-gí'], ['臺語', 'tâi-gí'], ['台', 'tâi'], ['臺', 'tâi'], ['𧉟', 'tâi'], ['抬', 'tâi']],
    'tai5gi2t': ['tai5gi2t', ['台', 'tâi'], ['臺', 'tâi'], ['台語', 'tâi-gí'], ['𧉟', 'tâi'], ['抬', 'tâi'], ['枱', 'tâi']],
    'tai5gi2ts': ['tai5gi2ts', ['台', 'tâi'], ['臺', 'tâi'], ['台語', 'tâi-gí'], ['𧉟', 'tâi'], ['抬', 'tâi'], ['枱', 'tâi']],
    'tai5gi2tsi': ['tai5gi2tsi', ['台語誌', 'tâi-gí tsì'], ['台', 'tâi'], ['臺', 'tâi'], ['台語', 'tâi-gí'], ['𧉟', 'tâi'], ['抬', 'tâi']],
    'tai5gi2tsin': ['tai5gi2tsin', ['台語真', 'tâi-gí tsin'], ['台', 'tâi'], ['臺', 'tâi'], ['台語', 'tâi-gí'], ['𧉟', 'tâi'], ['抬', 'tâi']],
    'tai5gi2tsin1': ['tai5gi2tsin1', ['台語真', 'tâi-gí tsin'], ['台', 'tâi'], ['臺', 'tâi'], ['台語', 'tâi-gí'], ['𧉟', 'tâi'], ['抬', 'tâi']],
    'tai5gi2tsin1s': ['tai5gi2tsin1s', ['台', 'tâi'], ['臺', 'tâi'], ['台語', 'tâi-gí'], ['𧉟', 'tâi'], ['抬', 'tâi'], ['枱', 'tâi']],
    'tai5gi2tsin1su': ['tai5gi2tsin1su', ['台語真書', 'tâi-gí tsin-su'], ['台', 'tâi'], ['臺', 'tâi'], ['台語', 'tâi-gí'], ['𧉟', 'tâi'], ['抬', 'tâi']],
    'tai5gi2tsin1sui': ['tai5gi2tsin1sui', ['台語真媠', 'tâi-gí tsin-suí'], ['台', 'tâi'], ['臺', 'tâi'], ['台語', 'tâi-gí'], ['𧉟', 'tâi'], ['抬', 'tâi']],
    'tai5gi2tsin1sui2': ['tai5gi2tsin1sui2', ['台語真媠', 'tâi-gí tsin-suí'], ['台', 'tâi'], ['臺', 'tâi'], ['台語', 'tâi-gí'], ['𧉟', 'tâi'], ['抬', 'tâi']],
  };
  const KEYS = ['q', 'w', 'd', 'f', 'z', 'x'];
  const rows = {};
  for (const [raw, [lit, ...cs]] of Object.entries(DUMP)) {
    const row = $('div', 'mrow', panel);
    $('div', 'mcell lit', row, '<span class="h">' + lit + '</span>');
    const cells = cs.map(([hz, rm], i) => {
      $('div', 'msep', row);
      return $('div', 'mcell' + (i === 0 ? ' on' : ''), row, '<span class="ix">' + KEYS[i] + '</span><span class="st"><span class="h">' + hz + '</span><span class="r">' + rm + '</span></span>');
    });
    $('div', 'mchev', row, '<svg width="14" height="9" viewBox="0 0 14 9"><path d="M1.5 1.5l5.5 5.5 5.5-5.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    rows[raw] = { row, cells };
  }

  const typed = 'tai5gi2tsin1sui2';
  const r = rng(314);
  let t = 34.35; const presses = [];
  for (const c of typed) {
    const tone = /\d/.test(c);
    presses.push({ t, c, tone });
    EVENTS.push({ t, type: tone ? 'tonekey' : 'key', v: r(), mac: 1 });
    t += .142 * (0.8 + r() * .45) + (tone ? .05 : 0);
  }
  const tPick = t + .55; // press q → slot 0
  EVENTS.push({ t: tPick, type: 'key', v: .5, mac: 1 });
  EVENTS.push({ t: tPick + .08, type: 'chime', note: 4, level: .5 });
  EVENTS.push({ t: tIn + .1, type: 'whoosh', level: .45 });
  const allKeys = [...presses.map(p => ({ t: p.t, label: p.c, tone: p.tone })), { t: tPick, label: 'q', pick: true }];
  const caps = allKeys.map(k => {
    const e = $('div', 'cap', keysEl);
    if (k.tone && MARKS[k.label]) { e.classList.add('tone'); $('div', 'mk', e, MARKS[k.label]); $('div', 'd', e, k.label); }
    else e.textContent = k.label;
    if (k.pick) e.style.color = '#0071e3';
    return e;
  });

  // camera: whole desktop → push in on the insertion point
  const S0 = 1920 / 1440;
  scenes.push(tt => {
    const pIn = eOut5(seg(tt, tIn, tIn + 1.3));
    const pOut = eIO(seg(tt, tOut, tOut + .8));
    const o = clamp(pIn * 1.3) * (1 - pOut);
    L.style.display = o <= .001 ? 'none' : '';
    if (o <= .001) return;
    L.style.opacity = o;
    L.style.filter = pOut > .01 ? 'blur(' + (pOut * 14) + 'px)' : ((1 - pIn) > .01 ? 'blur(' + ((1 - pIn) * 10) + 'px)' : 'none');
    const zp = eIO(seg(tt, tIn + .9, tIn + 2.1)) * (1 - eIO(seg(tt, tOut - 1.0, tOut + .3)));
    const z = lerp(1, 1.78, zp);
    const fx = lerp(720, 590, zp), fy = lerp(405, 318, zp);
    const s = S0 * z * lerp(1.04, 1, pIn);
    D.style.transform = 'translate(' + (960 - fx * s) + 'px,' + (540 - fy * s + (1 - pIn) * 60) + 'px) scale(' + s + ')';

    let n = 0; presses.forEach(p => { if (tt >= p.t) n++; });
    const picked = tt >= tPick + .05;
    const raw = typed.slice(0, n);
    if (picked) { docText.className = ''; docText.textContent = '台語真媠'; }
    else { docText.className = n ? 'mcomp' : ''; docText.textContent = raw; }
    const tLast = picked ? tPick : (n ? presses[n - 1].t : tIn);
    mcaret.style.opacity = (tt - tLast < .5 || Math.cos((tt - tLast - .5) * Math.PI * 2 / 1.06) > -.1) ? 1 : 0;
    // candidate panel under the marked text
    const show = n > 0 && !picked;
    panel.style.display = show ? 'block' : 'none';
    for (const [k, v] of Object.entries(rows)) v.row.style.display = show && k === raw ? 'flex' : 'none';
    if (show) {
      const ap = eOut(seg(tt, presses[0].t, presses[0].t + .2));
      panel.style.opacity = ap; panel.style.transform = 'translateY(' + ((1 - ap) * -4) + 'px)';
      if (raw === typed) {
        const fl = seg(tt, tPick - .09, tPick - .02);
        rows[raw].cells[0].style.filter = 'brightness(' + (1 - .12 * fl) + ')';
      }
    }
    // keycap conveyor (screen space)
    keysEl.style.opacity = 1 - eIO(seg(tt, tPick + .5, tPick + 1.1));
    let shift = 0; allKeys.forEach((k, i) => { if (i) shift += eOut(seg(tt, k.t, k.t + .22)); }); shift = Math.min(shift, 3.2) / 2;
    allKeys.forEach((k, i) => {
      const e = caps[i];
      let m = 0; for (let j = i + 1; j < allKeys.length; j++) m += eOut(seg(tt, allKeys[j].t, allKeys[j].t + .22));
      const a = seg(tt, k.t - .01, k.t + .12);
      const press = seg(tt, k.t, k.t + .09), rel = seg(tt, k.t + .09, k.t + .3);
      const sc = (0.85 + 0.15 * eBack(a)) * (1 - 0.06 * press + 0.06 * eOut(rel));
      e.style.opacity = eOut(a) * (1 - clamp((m - 3.2) / 1.6));
      e.style.display = +e.style.opacity > .001 ? '' : 'none';
      e.style.transform = 'translateX(' + ((-m + shift) * 84) + 'px) scale(' + sc + ')';
      e.style.background = mix('#ffffff', '#e8e8ed', press * (1 - rel));
    });
  });
})();

// ---------- Scene H: end card ----------
(function () {
  const L = $('div', 'layer', stage);
  const tIn = 40.35;
  const ic = $('div', 'icon', L, '<img src="assets/icon.png">');
  const S = 160; Object.assign(ic.style, { width: S + 'px', height: S + 'px', marginLeft: -S / 2 + 'px', top: '300px', marginTop: 0 });
  const n1 = $('div', 'brand', L, '台語齒盤'); Object.assign(n1.style, { top: '508px', font: '66px GenMin', color: '#1d1d1f', letterSpacing: '.14em', textIndent: '.14em' });
  const n2 = $('div', 'brand sf', L, 'TaigiKeyboard'); Object.assign(n2.style, { top: '610px', fontSize: '27px', fontWeight: 500, color: '#86868b', letterSpacing: '.08em' });
  const p = $('div', 'brand sf', L); Object.assign(p.style, { top: '724px', fontSize: '25px', fontWeight: 500, color: '#1d1d1f' });
  const names = ['iOS', 'macOS', 'Android', 'Windows', 'Linux'];
  const els = names.map(nm => { const e = $('span', null, p, nm); e.style.display = 'inline-block'; e.style.margin = '0 20px'; return e; });
  EVENTS.push({ t: tIn + .1, type: 'bloom', level: 1 });
  names.forEach((_, i) => EVENTS.push({ t: tIn + 1.25 + i * .13, type: 'tick', level: .35, note: i }));
  scenes.push(t => {
    if (!presence(L, t, tIn, DURATION - .75, { dIn: 1.0, dOut: .75, rise: 0, blur: 10 })) return;
    const a = eOut(seg(t, tIn, tIn + 1.4));
    ic.style.opacity = a; ic.style.transform = 'scale(' + lerp(.9, 1, a) + ')';
    const b = eOut(seg(t, tIn + .4, tIn + 1.6));
    n1.style.opacity = b; n1.style.transform = 'translateY(' + ((1 - b) * 16) + 'px)'; n1.style.filter = b < .999 ? 'blur(' + ((1 - b) * 10) + 'px)' : 'none';
    const c = eOut(seg(t, tIn + .7, tIn + 1.8));
    n2.style.opacity = c; n2.style.transform = 'translateY(' + ((1 - c) * 12) + 'px)';
    els.forEach((e, i) => {
      const q = eOut(seg(t, tIn + 1.2 + i * .13, tIn + 2.0 + i * .13));
      e.style.opacity = q; e.style.transform = 'translateY(' + ((1 - q) * 14) + 'px)';
    });
  });
})();

EVENTS.sort((a, b) => a.t - b.t);
window.render = t => { for (const f of scenes) f(t); };
window.EVENTS = EVENTS;
window.DURATION = DURATION;
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load('124px Huninn', 'tâi'), document.fonts.load('150px GenMin', '台語'), document.fonts.load('60px GenGo', '台')
])).then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => { render(0); return true; });
</script>
