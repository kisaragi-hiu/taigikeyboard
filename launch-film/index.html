<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TaigiKeyboard Film</title>
<style>
@font-face { font-family: Huninn; src: url(assets/jf_openhuninn_2_1.ttf); }
@font-face { font-family: GenMin; src: url(assets/genyomin2tw_r.otf); }
@font-face { font-family: GenGo; src: url(assets/genyogothic2tw_r.otf); }
@font-face { font-family: Iansui; src: url(assets/iansui_regular.ttf); }
:root {
  --ink: #1d1d1f;
  --ink2: #86868b;
  --ink3: #c7c7cc;
  --accent: #0071e3;
  --bg: #fbfbfd;
  /* desktop window + candidate panel (light); the theme scene overrides these per frame */
  --wbg: #ffffff; --wink: #1d1d1f; --pbg: rgba(250,250,252,.92); --pink2: rgba(60,60,67,.62); --psep: rgba(0,0,0,.09);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* 4:5 portrait — the largest frame a feed post gets on Threads / Instagram / Facebook / X */
html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.layer { position: absolute; inset: 0; will-change: transform, opacity, filter; }
.sf { font-family: "SF Pro Display", "SF Pro Text", -apple-system, sans-serif; }
.ui { font-family: "SF Pro Text", "SF Pro Display", GenGo, "PingFang TC", sans-serif; }

/* section caption — the film is silent, so every section names itself on screen */
.capt { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }
.capt .en { font: 500 22px "SF Pro Display", sans-serif; letter-spacing: .34em; text-indent: .34em; color: var(--ink2); text-transform: uppercase; }
.capt .zh { margin-top: 12px; font: 84px GenMin; color: var(--ink); letter-spacing: .1em; text-indent: .1em; line-height: 1.2; }

/* hero typing */
.label { position: absolute; left: 0; right: 0; text-align: center; top: 400px;
  font: 500 24px "SF Pro Display", sans-serif; letter-spacing: .42em; color: var(--ink2); text-indent: .42em; }
.hero { position: absolute; left: 0; right: 0; top: 590px; height: 150px; text-align: center; transform-origin: 50% 50%; }
.line { display: inline-block; position: relative; font-family: Huninn; color: var(--ink); white-space: pre; line-height: 150px; }
.cl { display: inline-block; position: relative; }
.cl .sz { visibility: hidden; }
.cl span.l { position: absolute; left: 0; top: 0; }
.caret { position: absolute; top: 34px; width: 4px; height: 94px; border-radius: 2px; background: var(--accent); }
.uline { position: absolute; top: 128px; height: 3px; border-radius: 2px; background: #c7c7cc; left: 0; }
.hanji { position: absolute; left: 0; right: 0; top: 480px; text-align: center; font-family: GenMin; color: var(--ink); white-space: nowrap; }
.keys { position: absolute; left: 50%; top: 900px; width: 0; height: 0; }
.cap { position: absolute; left: -34px; top: 0; width: 68px; height: 76px; border-radius: 13px; background: #fff;
  box-shadow: 0 1px 0 rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.06); display: flex; align-items: center; justify-content: center;
  font-family: Huninn; font-size: 36px; color: var(--ink); }
.cap .mk { position: absolute; top: 2px; left: 0; right: 0; text-align: center; font-size: 26px; color: var(--accent); }
.cap.tone .d { margin-top: 10px; }

/* triptych */
.tri-h { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font: 150px GenMin; color: var(--ink); }
.tri-row { position: absolute; left: 0; right: 0; height: 90px; display: flex; justify-content: center; align-items: baseline; }
.tri-row .k { width: 150px; text-align: right; padding-right: 40px; font: 500 22px "SF Pro Display"; letter-spacing: .3em; color: var(--ink2); }
.tri-row .v { width: 700px; font: 56px Huninn; color: var(--ink); white-space: pre; }

/* phone */
.phone { position: absolute; width: 486px; height: 1000px; transform-origin: 0 0; }
.bezel { position: absolute; inset: 0; border-radius: 76px; background: #111113;
  box-shadow: 0 0 0 2px #2c2c2e inset, 0 50px 120px rgba(0,0,0,.18), 0 12px 32px rgba(0,0,0,.12); }
.screen { position: absolute; left: 13px; top: 13px; right: 13px; bottom: 13px; border-radius: 64px; overflow: hidden; background: #fff; }
.island { position: absolute; left: 50%; top: 14px; width: 118px; height: 34px; margin-left: -59px; border-radius: 17px; background: #000; z-index: 5; }
.status { position: absolute; top: 20px; left: 44px; right: 40px; font: 600 17px "SF Pro Text", "SF Pro Display"; color: #000; display: flex; justify-content: space-between; }
.kb { position: absolute; left: 0; right: 0; bottom: 0; }
.kbbg { position: absolute; inset: 0; }
.field { position: absolute; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.plus { width: 40px; height: 40px; border-radius: 50%; background: #efeff2; display: flex; align-items: center; justify-content: center; }
.pill { flex: 1; height: 42px; border-radius: 21px; background: #ececee; position: relative; display: flex; align-items: center; padding: 0 44px 0 16px;
  font: 22px Huninn; color: #111; white-space: nowrap; overflow: hidden; }
.send { width: 40px; height: 40px; border-radius: 50%; background: #5b6cf6; display: flex; align-items: center; justify-content: center; }
.fcaret { display: inline-block; width: 2px; height: 26px; background: #0a84ff; vertical-align: middle; margin-left: 1px; }
.comp { border-bottom: 2px solid #9a9aa0; padding-bottom: 1px; }
.cbar { position: absolute; left: 0; right: 0; height: 64px; display: flex; align-items: center; overflow: hidden; font-family: Huninn; }
.cbar .cplus { width: 40px; flex: none; text-align: center; font-size: 30px; font-weight: 300; }
.cands { flex: 1; position: relative; height: 64px; overflow: hidden; }
.crow { position: absolute; left: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip { height: 38px; border-radius: 10px; padding: 0 12px; display: flex; align-items: center; font-size: 24px; }
.cell { padding: 0 11px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.cell .h { font-size: 26px; }
.cell .r { font-size: 16px; margin-top: 5px; opacity: .55; }
.chev { width: 52px; flex: none; height: 40px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(128,128,128,.35); }
.keyarea { position: absolute; left: 0; right: 0; }
.key { position: absolute; display: flex; align-items: center; justify-content: center; font-family: Huninn; }
.key .tm { position: absolute; left: 0; right: 0; text-align: center; }
.callout { position: absolute; border-radius: 12px; display: flex; align-items: flex-start; justify-content: center; font-family: Huninn; z-index: 4; }
.tap { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(60,60,67,.22); z-index: 6; }
.sysrow { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; }
.homebar { position: absolute; left: 50%; bottom: 9px; width: 150px; height: 5px; margin-left: -75px; border-radius: 3px; background: #000; }

/* desktop window (logical points; scaled onto the frame) */
.desk { position: absolute; width: 600px; height: 325px; transform-origin: 0 0; }
.dwin { position: absolute; inset: 0; border-radius: 16px; background: var(--wbg); overflow: hidden;
  box-shadow: 0 0 0 .5px rgba(0,0,0,.16), 0 22px 56px rgba(30,40,70,.20), 0 5px 14px rgba(30,40,70,.10); }
.mtitle { height: 40px; display: flex; align-items: center; gap: 7px; padding-left: 14px; }
.tl { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.tl.r { background: #ff5f57; } .tl.y { background: #febc2e; } .tl.g { background: #28c840; }
.mdoc { position: absolute; left: 32px; top: 62px; right: 32px; font: 20px "SF Pro Text", "SF Pro Display", "PingFang TC", sans-serif; color: var(--wink); white-space: pre; }
.mcomp { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
.mcaret { display: inline-block; width: 2px; height: 24px; background: var(--wink); vertical-align: -5px; margin-left: 1px; }
.mpanel { position: absolute; border-radius: 16px; padding: 4px; background: var(--pbg);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.16), inset 0 0 0 1px rgba(255,255,255,.14), 0 12px 36px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.08);
  font-family: "SF Pro Text", "SF Pro Display", "PingFang TC", sans-serif; color: var(--wink); transform-origin: 0 0; }
.mrow { display: flex; align-items: stretch; }
.mcell { display: flex; align-items: center; gap: 2px; padding: 9px 7px; border-radius: 12px; white-space: nowrap; }
.mcell.lit { font-size: 17px; }
.mcell .ix { font-size: 11px; color: var(--pink2); align-self: flex-start; margin-top: 3px; min-width: 13px; text-align: center; }
.mcell .st { display: flex; flex-direction: column; align-items: flex-start; }
.mcell .h { font-size: 17px; line-height: 21px; }
.mcell .r { font-size: 15px; line-height: 18px; margin-top: 2px; color: var(--pink2); }
.mcell.on { background: var(--acc, #0088ff); color: #fff; }
.mcell.on .ix, .mcell.on .r { color: rgba(255,255,255,.85); }
.msep { width: 1px; margin: 9px 0; background: var(--psep); }
.mcell.on + .msep, .msep:has(+ .mcell.on) { opacity: 0; }
.mchev { display: flex; align-items: center; padding: 0 9px 0 7px; color: var(--pink2); }
/* vertical layout: one row per candidate, annotations aligned on one x */
.mcol { display: grid; grid-template-columns: auto auto; }
.mcol .vr { display: contents; }
.mcol .vr > span { padding: 7px 12px; font-size: 17px; line-height: 21px; white-space: nowrap; }
.mcol .vr > span:first-child { border-radius: 12px 0 0 12px; }
.mcol .vr > span:last-child { border-radius: 0 12px 12px 0; color: var(--pink2); font-size: 15px; padding-left: 6px; }
.mcol .vr.on > span { background: var(--acc, #0088ff); color: #fff; }
/* expandable layout: the row unfolded into a column-quantized grid */
.mgridwrap { overflow: hidden; }
.mgridrow { display: grid; }
.mgridsep { height: 1px; margin: 0 7px; background: var(--psep); }

/* segmented control */
.segc { position: absolute; border-radius: 18px; background: #e9e9ee; }
.segc .thumb { position: absolute; top: 4px; bottom: 4px; border-radius: 14px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.05); }
.segc .opts { position: absolute; inset: 0; display: flex; }
.segc .opts span { flex: 1; display: flex; align-items: center; justify-content: center; font-family: GenGo, sans-serif; color: var(--ink); }
.eyebrow { position: absolute; font: 500 22px "SF Pro Display", GenGo, sans-serif; letter-spacing: .2em; color: var(--ink2); white-space: nowrap; }

/* candidate-display showcase bar (mobile candidate bar, enlarged) */
.showbar { position: absolute; left: 60px; width: 960px; height: 150px; border-radius: 30px; background: #cbd3e0; overflow: hidden; font-family: Huninn; color: #1c1c1e; }
.showbar .srow { position: absolute; left: 28px; top: 0; height: 150px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.showbar .chip { height: 76px; border-radius: 20px; padding: 0 24px; font-size: 46px; background: #ecedf1; margin-right: 10px; }
.showbar .cell { padding: 0 20px; }
.showbar .cell .h { font-size: 52px; }
.showbar .cell .r { font-size: 31px; margin-top: 10px; }
.showbar .one { padding: 0 18px; font-size: 48px; }
.showbar .one.rm { font-size: 42px; }

/* settings / dictionary lists (iOS grouped-list shape) */
.card { position: absolute; left: 90px; width: 900px; border-radius: 40px; background: #f2f2f7; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 24px 60px rgba(30,40,70,.10); }
.scroll { position: absolute; left: 0; right: 0; top: 0; padding: 26px 30px; }
.sech { font: 26px GenGo, sans-serif; color: #6d6d72; padding: 28px 22px 12px; }
.grp { border-radius: 24px; background: #fff; overflow: hidden; }
.row { height: 84px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font: 32px GenGo, "SF Pro Text", sans-serif; color: var(--ink); white-space: nowrap; }
.row + .row { box-shadow: inset 0 1px 0 rgba(60,60,67,.12); }
.row .val { color: #8e8e93; font-size: 30px; display: flex; align-items: center; gap: 12px; }
.row .rm { font-family: Huninn; color: #8e8e93; font-size: 28px; margin-left: 18px; }
.tg { width: 76px; height: 46px; border-radius: 23px; position: relative; flex: none; }
.tg i { position: absolute; left: 3px; top: 3px; width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
.addbtn { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.pills { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; }
.pills span { height: 68px; padding: 0 30px; border-radius: 34px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 8px 22px rgba(30,40,70,.08);
  display: flex; align-items: center; font: 30px GenGo, sans-serif; color: var(--ink); }

/* platforms + theme side column */
.pname { position: absolute; left: 84px; font: 600 62px "SF Pro Display", sans-serif; letter-spacing: -.01em; }
.dots { position: absolute; display: flex; gap: 12px; }
.dot { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.10); position: relative; }
.dot b { position: absolute; inset: -7px; border-radius: 50%; border: 4px solid var(--accent); }
.tname { position: absolute; font: 40px GenGo, sans-serif; color: var(--ink); white-space: nowrap; }
.dots.acc { gap: 13px; }
.dots.acc .dot { width: 46px; height: 46px; }
.dots.acc .dot b { inset: -6px; border-width: 3px; border-color: currentColor; }

/* desktop panes: shortcuts + typefaces */
.card.desk .row { height: 74px; }
.keys2 { display: flex; align-items: center; gap: 8px; }
.kc { min-width: 46px; height: 46px; padding: 0 12px; border-radius: 11px; background: #f2f2f7; box-shadow: inset 0 0 0 1px rgba(60,60,67,.14);
  display: flex; align-items: center; justify-content: center; font: 500 26px "SF Pro Text", "SF Pro Display", sans-serif; color: var(--ink); }
.rec { height: 46px; padding: 0 18px; border-radius: 11px; box-shadow: inset 0 0 0 2px var(--accent); display: flex; align-items: center;
  font: 26px GenGo, sans-serif; color: var(--accent); }
.row .smp { font-size: 28px; }

/* end */
.icon { position: absolute; left: 50%; top: 50%; border-radius: 22.37%; overflow: hidden; background: #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 24px 60px rgba(0,0,0,.10), 0 6px 16px rgba(0,0,0,.06); }
.icon img { width: 100%; height: 100%; display: block; }
.brand { position: absolute; left: 0; right: 0; text-align: center; }
</style>
</head>

<div id="stage"></div>
<script>
// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eOut5 = p => 1 - Math.pow(1 - p, 5);
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = p => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixRGB = (a, b, p) => { const A = hex(a), B = hex(b); return A.map((v, i) => Math.round(lerp(v, B[i], p))); };
const mix = (a, b, p) => `rgb(${mixRGB(a, b, p).join(',')})`;
const blinkOn = (t, tLast) => t - tLast < .5 || Math.cos((t - tLast - .5) * Math.PI * 2 / 1.06) > -.1;
// index of the last step whose time has passed, plus eased progress into it
const stepAt = (t, times, d = .5) => { let i = 0; for (let j = 1; j < times.length; j++) if (t >= times[j]) i = j; return { i, p: i === 0 ? 1 : eIO(seg(t, times[i], times[i] + d)) }; };

const stage = document.getElementById('stage');
const scenes = [];
const SIZE = { width: 1080, height: 1350 };
const DURATION = 40;

// fade a whole layer in/out with blur and drift
function presence(el, t, tin, tout, opts = {}) {
  const dIn = opts.dIn ?? .7, dOut = opts.dOut ?? .6, rise = opts.rise ?? 0, blur = opts.blur ?? 14;
  const pi = eOut(seg(t, tin, tin + dIn));
  const po = eIO(seg(t, tout, tout + dOut));
  const o = pi * (1 - po);
  el.style.opacity = o;
  el.style.display = o <= 0.001 ? 'none' : '';
  const y = (1 - pi) * rise - po * (opts.riseOut ?? rise * .6);
  const s = lerp(opts.scaleIn ?? 1, 1, pi) * lerp(1, opts.scaleOut ?? 1, po);
  el.style.transform = `translateY(${y}px) scale(${s})`;
  const b = (1 - pi) * blur + po * blur;
  el.style.filter = b > .05 ? `blur(${b}px)` : 'none';
  return o;
}
function caption(L, en, zh) {
  const c = $('div', 'capt', L); $('div', 'en', c, en); $('div', 'zh', c, zh);
  return (t, tIn) => { const p = eOut(seg(t, tIn + .05, tIn + .9)); c.style.opacity = p; c.style.transform = `translateY(${(1 - p) * 14}px)`; };
}
// staggered rise-in for a block
function rise(el, t, t0, d = .8, dy = 22) {
  const p = eOut(seg(t, t0, t0 + d));
  el.style.opacity = p; el.style.translate = `0 ${(1 - p) * dy}px`;
  return p;
}
function segControl(parent, labels, x, y, w, h, fs) {
  const c = $('div', 'segc', parent);
  Object.assign(c.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  const thumb = $('div', 'thumb', c);
  const opts = $('div', 'opts', c);
  labels.forEach(l => { $('span', null, opts, l).style.fontSize = fs + 'px'; });
  const cw = (w - 8) / labels.length;
  thumb.style.width = cw + 'px';
  return { el: c, set(pos) { thumb.style.left = (4 + cw * pos) + 'px'; } };
}
function toggle(parent) {
  const e = $('div', 'tg', parent, '<i></i>');
  return p => { e.style.background = mix('#e9e9ea', '#34c759', p); e.firstChild.style.transform = `translateX(${p * 30}px)`; };
}

// ---------- phone (real TL layout geometry, 585-px reference screenshots) ----------
// real engine output (candidate_dump, mode=tl) for each prefix of "tsiahpabue"
const STRIPS = {
  't': [['佇', 'tī'], ['台', 'tâi'], ['就', 'tō'], ['代', 'tāi'], ['大', 'tāi']],
  'ts': [['今', 'tse'], ['即', 'tse'], ['這', 'tse'], ['做', 'tsò'], ['主', 'tsú']],
  'tsi': [['誌', 'tsì'], ['子', 'tsí'], ['止', 'tsí'], ['只', 'tsí'], ['支', 'tsi']],
  'tsia': [['者', 'tsiá'], ['這', 'tsia'], ['遮', 'tsia'], ['姐', 'tsiá'], ['嗟', 'tsia']],
  'tsiah': [['吃', 'tsia̍h'], ['噍', 'tsia̍h'], ['食', 'tsia̍h'], ['即', 'tsiah'], ['者', 'tsiah']],
  'tsiahp': [['吃', 'tsia̍h'], ['噍', 'tsia̍h'], ['食', 'tsia̍h'], ['即', 'tsiah'], ['者', 'tsiah']],
  'tsiahpa': [['食飽', 'tsia̍h-pá'], ['吃', 'tsia̍h'], ['噍', 'tsia̍h'], ['食', 'tsia̍h'], ['即', 'tsiah']],
  'tsiahpab': [['吃', 'tsia̍h'], ['噍', 'tsia̍h'], ['食', 'tsia̍h'], ['即', 'tsiah'], ['者', 'tsiah']],
  'tsiahpabu': [['食飽母', 'tsia̍h-pá bú'], ['吃', 'tsia̍h'], ['噍', 'tsia̍h'], ['食', 'tsia̍h'], ['即', 'tsiah']],
  'tsiahpabue': [['食飽未', 'tsia̍h-pá--buē'], ['吃', 'tsia̍h'], ['噍', 'tsia̍h'], ['食', 'tsia̍h'], ['即', 'tsiah']],
};
const PHONE_TYPED = 'tsiahpabue', PHONE_COMMIT = '食飽未';
// built-in palettes (ios/Sources/TaigiKeyboard/Theme/BuiltInThemes.swift)
const PALETTE = {
  def: { zh: '預設', top: '#cbd3e0', bot: '#cbd3e0', key: '#ffffff', text: '#1c1c1e' },
  sakura: { zh: '櫻花', top: '#e6c2d0', bot: '#eadce2', key: '#ffffff', text: '#1c1c1e' },
  gold: { zh: '金煌', top: '#ead9a6', bot: '#ece4d2', key: '#ffffff', text: '#1c1c1e' },
  sea: { zh: '海風', top: '#bfd2ea', bot: '#dce2ec', key: '#ffffff', text: '#1c1c1e' },
  jade: { zh: '翠青', top: '#c3d8c8', bot: '#dce5dd', key: '#ffffff', text: '#1c1c1e' },
  wisteria: { zh: '藤紫', top: '#cdc4e4', bot: '#dedaea', key: '#ffffff', text: '#1c1c1e' },
  cat: { zh: '暗眠山貓', top: '#1e1e2e', bot: '#181825', key: '#313244', text: '#cdd6f4', dark: 1 },
};
// key styles: Filled / Outlined / Borderless → [fill, outline]
const STYLES = [['素色', 1, 0], ['框線', 0, 1], ['無框', 0, 0]];

    .map(([n, k]) => $('div', 'keys2', $('div', 'row', c1.g, `<span>${n}</span>`), chord(k)));
  // re-record one: old chord → "Press a key…" → new chord
  const slot = acts[1], was = slot.innerHTML, rec = '<span class="rec">揤一个齒…</span>', now = chord(['⌥', 'T']);
  const tRec = tIn + 1.2, tSet = tIn + 2.0;

  // Manage Fonts pane: one list, the selected row is the typeface the candidate window is set in
  const c2 = paneCard(748, 506, '字型管理');
  $('div', 'addbtn', c2.head, '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>');
  const SYS = '"SF Pro Text", "PingFang TC", sans-serif';
  const faces = [['系統', SYS], ['粉圓', 'Huninn'], ['芫荽', 'Iansui'], ['源樣明體', 'GenMin'], ['源樣烏體', 'GenGo']].map(([n, f]) => {
    const row = $('div', 'row', c2.g, `<span>${n}</span><span class="smp">台語齒盤　tâi-gí khí-puânn</span>`);
    row.style.fontFamily = f;
    return row;
  });
  const tFace = faces.map((_, i) => i === 0 ? 0 : tIn + .9 + i * .62);

  scenes.push(tt => {
    if (!presence(L, tt, tIn, tOut)) return;
    cap(tt, tIn);
    rise(c1.c, tt, tIn + .15, .9, 50); rise(c2.c, tt, tIn + .3, .9, 50);
    const html = tt < tRec ? was : (tt < tSet ? rec : now);
    if (slot.innerHTML !== html) slot.innerHTML = html;
    slot.parentNode.style.background = mix('#ffffff', '#e5f0fd', eOut(seg(tt, tRec, tRec + .2)) * (1 - eIO(seg(tt, tSet + .3, tSet + .9))));
    const st = stepAt(tt, tFace, .3);
    faces.forEach((row, i) => {
      const o = i === st.i ? st.p : (i === st.i - 1 ? 1 - st.p : 0);
      row.style.background = mix('#ffffff', ACCENTS[0], o);
      row.style.color = mix('#1d1d1f', '#ffffff', o);
      row.lastChild.style.color = mix('#8e8e93', '#ffffff', o);
    });
  });
})();

// ---------- Scene H: themes — mobile palettes × key styles, desktop light / dark × accent colour ----------
(function () {
  const L = $('div', 'layer', stage);
  const tIn = 30.4, tOut = 34.8;
  const cap = caption(L, 'Theme', '主題');
  const duo = makeDuo(L);
  const order = ['def', 'sakura', 'gold', 'sea', 'jade', 'wisteria', 'cat'];
  // [palette, key style] walk
  const WALK = [['def', 0], ['sakura', 0], ['gold', 0], ['sea', 1], ['jade', 1], ['wisteria', 2], ['cat', 2]];
  const times = WALK.map((_, i) => i === 0 ? 0 : tIn + .7 + i * .44);
  const tDark = times[4];

  const e1 = $('div', 'eyebrow', L, 'iOS　Android'); Object.assign(e1.style, { left: '70px', top: '850px' });
  const dots = $('div', 'dots', L); Object.assign(dots.style, { left: '70px', top: '896px' });
  const rings = order.map(n => { const d = $('div', 'dot', dots); d.style.background = `linear-gradient(180deg, ${PALETTE[n].top}, ${PALETTE[n].bot})`; return $('b', null, d); });
  const tname = order.map(n => { const e = $('div', 'tname', L, PALETTE[n].zh); Object.assign(e.style, { left: '70px', top: '984px' }); return e; });
  const styleSeg = segControl(L, STYLES.map(s => s[0]), 250, 978, 290, 64, 27);
  const e2 = $('div', 'eyebrow', L, '外觀　·　macOS　Windows'); Object.assign(e2.style, { left: '70px', top: '1092px' });
  // Appearance: Light / Dark / Automatic
  const appSeg = segControl(L, ['淺色', '深色', '自動'], 70, 1136, 470, 72, 30);
  // the candidate window's highlight takes the system accent colour — one per theme step, graphite left unvisited
  const adots = $('div', 'dots acc', L); Object.assign(adots.style, { left: '70px', top: '1238px' });
  const arings = ACCENTS.map(c => { const d = $('div', 'dot', adots); d.style.background = d.style.color = c; return $('b', null, d); });

  scenes.push(tt => {
    if (!presence(L, tt, tIn, tOut, { dIn: .5 })) return;
    cap(tt, tIn); duoEnter(duo, tt, tIn);
    [e1, dots, styleSeg.el, e2, appSeg.el, adots].forEach((e, i) => rise(e, tt, tIn + .4 + i * .08, .7, 18));
    const st = stepAt(tt, times, .42);
    const A = themeOf(...WALK[Math.max(0, st.i - 1)]), B = themeOf(...WALK[st.i]);
    duo.phone.update(themeMix(A, B, st.p), { n: PHONE_TYPED.length, committed: false, caretOn: true, appear: 1 });
    const cur = order.indexOf(WALK[st.i][0]), prev = order.indexOf(WALK[Math.max(0, st.i - 1)][0]);
    const shown = eOut(seg(tt, tIn + .4, tIn + 1));
    rings.forEach((r, i) => { const o = i === cur ? st.p : (i === prev ? 1 - st.p : 0); r.style.opacity = o; r.style.transform = `scale(${lerp(1.25, 1, o)})`; });
    tname.forEach((e, i) => { e.style.opacity = shown * (i === cur ? st.p : (i === prev && cur !== prev ? 1 - seg(tt, times[st.i], times[st.i] + .15) : 0)); });
    styleSeg.set(lerp(A.fill ? 0 : (A.outline ? 1 : 2), B.fill ? 0 : (B.outline ? 1 : 2), st.p));
    const dk = eIO(seg(tt, tDark, tDark + .5));
    appSeg.set(dk);
    const ai = st.i, ap = Math.max(0, st.i - 1);
    arings.forEach((r, i) => { const o = i === ai ? st.p : (i === ap ? 1 - st.p : 0); r.style.opacity = o; r.style.transform = `scale(${lerp(1.25, 1, o)})`; });
    duo.desk.update({ n: DESK_TYPED.length, picked: false, caretOn: true, appear: 1, dark: dk, accent: mix(ACCENTS[ap], ACCENTS[ai], st.p) });
  });
})();

// ---------- Scene K: free, open source ----------
(function () {
  const L = $('div', 'layer', stage);
  const tIn = 34.9, tOut = 37.3;
  const label = $('div', 'label', L, 'FREE · OPEN SOURCE'); label.style.top = '500px';
  const h = $('div', 'tri-h', L, '<span>自由</span> · <span>開源</span> · <span>免費</span>'); Object.assign(h.style, { top: '570px', fontSize: '112px' });
  const hl = [...h.querySelectorAll('span')];
  const src = $('div', 'brand sf', L, 'Apache-2.0　·　taigikeyboard.tw'); Object.assign(src.style, { top: '800px', fontSize: '28px', fontWeight: 500, color: '#86868b', letterSpacing: '.06em' });
  scenes.push(t => {
    if (!presence(L, t, tIn, tOut, { blur: 16 })) return;
    rise(label, t, tIn + .1, .9, 10);
    const ph = eOut(seg(t, tIn, tIn + 1.0));
    h.style.opacity = ph; h.style.transform = `translateY(${(1 - ph) * 24}px)`;
    h.style.letterSpacing = h.style.textIndent = lerp(.2, .08, eOut(seg(t, tIn, tIn + 2))) + 'em';
    const hp = eIO(seg(t, tIn + .9, tIn + 1.3)) * (1 - eIO(seg(t, tIn + 1.9, tIn + 2.3)));
    hl.forEach(e => e.style.color = mix('#1d1d1f', '#0071e3', hp));
    rise(src, t, tIn + .7, .8, 12);
  });
})();

// ---------- Scene I: end card (held to the last frame — feeds loop) ----------
(function () {
  const L = $('div', 'layer', stage);
  const tIn = 37.5;
  const ic = $('div', 'icon', L, '<img src="assets/icon.png">');
  const S = 190; Object.assign(ic.style, { width: S + 'px', height: S + 'px', marginLeft: -S / 2 + 'px', top: '360px', marginTop: 0 });
  const n1 = $('div', 'brand', L, '台語齒盤'); Object.assign(n1.style, { top: '610px', font: '84px GenMin', color: '#1d1d1f', letterSpacing: '.14em', textIndent: '.14em' });
  const n2 = $('div', 'brand sf', L, 'TaigiKeyboard'); Object.assign(n2.style, { top: '740px', fontSize: '32px', fontWeight: 500, color: '#86868b', letterSpacing: '.08em' });
  const p = $('div', 'brand sf', L); Object.assign(p.style, { top: '860px', fontSize: '32px', fontWeight: 500, color: '#1d1d1f' });
  const els = ['iOS', 'Android', 'macOS', 'Windows', 'Linux'].map(nm => { const e = $('span', null, p, nm); e.style.display = 'inline-block'; e.style.margin = '0 17px'; return e; });
  const n3 = $('div', 'brand', L, '自由　·　開源　·　免費'); Object.assign(n3.style, { top: '956px', font: '40px GenMin', color: '#1d1d1f', letterSpacing: '.1em', textIndent: '.1em' });
  const n4 = $('div', 'brand sf', L, 'Free · Open Source'); Object.assign(n4.style, { top: '1036px', fontSize: '24px', fontWeight: 500, color: '#86868b', letterSpacing: '.16em', textIndent: '.16em' });
  scenes.push(t => {
    if (!presence(L, t, tIn, DURATION + 1, { dIn: .9, blur: 10 })) return;
    const a = eOut(seg(t, tIn, tIn + 1.2));
    ic.style.opacity = a; ic.style.transform = 'scale(' + lerp(.9, 1, a) + ')';
    const b = rise(n1, t, tIn + .3, 1.0, 16); n1.style.filter = b < .999 ? 'blur(' + ((1 - b) * 10) + 'px)' : 'none';
    rise(n2, t, tIn + .5, 1.0, 12);
    els.forEach((e, i) => rise(e, t, tIn + .8 + i * .1, .7, 14));
    rise(n3, t, tIn + 1.4, .8, 10);
    rise(n4, t, tIn + 1.6, .8, 10);
  });
})();

window.render = t => { for (const f of scenes) f(t); };
window.SIZE = SIZE;
window.DURATION = DURATION;
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load('108px Huninn', 'tâi'), document.fonts.load('150px GenMin', '台語'), document.fonts.load('32px GenGo', '台'), document.fonts.load('32px Iansui', '芫荽')
])).then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => { render(0); return true; });
</script>
</body>
</html>
