syntax = "proto3";

package taigi.engine;

option java_package = "com.siansiansu.taigikeyboard.engine.proto";
option java_multiple_files = true;

// Phonetics module — POJ ↔ TL ↔ TPS spelling conversion, tone representation,
// syllable structure, Unicode normalization, phonological auto-correct.
//
// 9 ops live in PhoneticsRequest.method oneof; each op returns its natural
// shape via PhoneticsResponse.result oneof. Pattern mirrors iOS Composing
// `oneof method` design + khiin-rs single-entry-point dispatch.
//
// AppConfig (envelope.proto) carries per-request live snapshot — input mode,
// POJ oo/nn doubletap toggles. Engine never caches; live-read per call per
// behavioral-invariants.md §11.

// =========================================================================
// Request envelope
// =========================================================================

message PhoneticsRequest {
  // Retired ops with no production caller (removed 2026-09-25 / 2026-09-30).
  reserved 10, 12, 14, 15, 16, 20, 21, 22, 23, 30;
  reserved "normalize_tone", "normalize_to_tl", "restore_tone", "contains_tps";
  reserved "poj_to_tl", "normalize_input", "derive_notone", "derive_abbrev",
      "derive_custom_search_keys", "derive_custom_query_key";

  oneof method {
    // --- Phonetics core (4 ops) ---
    StripTone strip_tone = 11;
    TlToPoj tl_to_poj = 13;
    GetToneVariations get_tone_variations = 18;
    NfdPreprocessForLookup nfd_preprocess_for_lookup = 19;

    // --- TPS (4 ops) ---
    TlNumericToTps tl_numeric_to_tps = 32;
    TlDisplayToTps tl_display_to_tps = 33;
    IsTpsToneMark is_tps_tone_mark = 34;
    TpsInputAdjust tps_input_adjust = 35;
  }
}

// =========================================================================
// Phonetics core request payloads
// =========================================================================

message StripTone { string input = 1; }
message TlToPoj { string input = 1; }

// `GetToneVariations` is the init-bulk-pull op for callout tone variation
// tables. Returns POJ + TL maps in one response. Caller caches once at
// engine init (lazy / idempotent on platform side).
message GetToneVariations {}

// `NfdPreprocessForLookup` runs Taigi-specific Unicode preprocessing for
// external dictionary URL lookup: replace POJ nasal markers (ⁿ U+207F /
// ᴺ U+1D3A) with `nn`, NFD-decompose, then collapse standalone `\u{0358}`
// (POJ `o͘` combining mark) to `o`. Output preserves the input's letters
// and combining tone marks so the URL builder can run `strip_tone` on the
// result. Replaces both platforms' `TaigiUnicode.nfdPreprocessed` call
// inside `ExternalLookupURLBuilder`.
//
// Distinct from the in-process `normalization::normalize_input` (which
// lowercases + extracts tone digits + adds default tones + splits syllables) — see
// `engine/phonetics/src/normalization.rs::taigi_unicode_base_form` doc
// for the algorithm contrast against `trie_key_unicode_form`.
message NfdPreprocessForLookup { string input = 1; }

// =========================================================================
// Derivation request payloads
// =========================================================================

// Custom-dictionary search keys have no wire op: the WRITE side (the full
// {tl, poj, tps} × {num, notone, abbrev} bundle for a stored roman) and the
// READ side (the one family-native query key) are both derived in-process
// by `engine/userdata` (`phonetics::api::derive_custom_search_keys` /
// `derive_custom_query_key`), behind the user-data ops (`SearchCustomEntries`).
// The `DeriveCustomQueryKey` op (tag 23) went with its last caller, the
// desktop settings search, on 2026-09-30.

// =========================================================================
// TPS request payloads
// =========================================================================

// `TlNumericToTps` input is numeric tone form (e.g. "hoo2"). Replaces
// iOS `TLToTPS.convert` / Android `TPSConverter.toTPS`.
message TlNumericToTps {
  string text = 1;
  bool or_maps_to_er = 2;
}

// `TlDisplayToTps` input is display form with diacritics (e.g. "hóo").
// Replaces iOS `TLToTPS.convertFromDisplay` / Android `TPSConverter.toTPSFromDisplay`.
message TlDisplayToTps {
  string text = 1;
  bool or_maps_to_er = 2;
}

// `IsTpsToneMark` checks if a single Unicode scalar is a TPS tone mark.
// `char` MUST be a single grapheme; engine returns false for empty / multi.
message IsTpsToneMark { string char = 1; }

// `TpsInputAdjust` is the collapsed TPSAdjustmentBundle entry point:
// runs adjustInitialKey → adjustNasalizedVowelKey → syllabicNasalReplacement
// ?: palatalizationReplacement. Caller MUST gate by TPS layout; engine
// does not gate (TPS is a layout, not a mode, on Android).
message TpsInputAdjust {
  string incoming = 1;
  string raw_input = 2;
}


// =========================================================================
// Response envelope
// =========================================================================

message PhoneticsResponse {
  // Tag 12 was the top-level `optional_string_result` (only `RestoreTone`
  // returned it; removed 2026-09-25). `OptionalStringResult` stays as the
  // `TpsAdjustResult.replace_last` field type.
  reserved 12, 16;
  reserved "optional_string_result", "custom_search_keys_result";

  oneof result {
    StringResult string_result = 10;
    StripToneResult strip_tone_result = 11;
    BoolResult bool_result = 13;
    ToneVariationsResult tone_variations_result = 14;
    TpsAdjustResult tps_adjust_result = 15;
  }
}

// =========================================================================
// Response payloads
// =========================================================================

message StringResult { string output = 1; }

// `StripToneResult` returns the bare syllable + extracted tone digit.
// `tone` is "" when no tone mark was present.
message StripToneResult {
  string bare = 1;
  string tone = 2;
}

// `OptionalStringResult` is a String? equivalent. `present` indicates
// whether `output` is meaningful (proto3 has no native optional for
// non-message scalar fields without the `optional` keyword).
message OptionalStringResult {
  string output = 1;
  bool present = 2;
}

message BoolResult { bool value = 1; }

// `ToneVariationsResult` is the callout init-pull payload. Maps the base
// char (e.g. "a") to its toned variations list (e.g. ["á", "à", "â", ...]).
message ToneVariationsResult {
  map<string, ToneVariationList> poj_variations = 1;
  map<string, ToneVariationList> tl_variations = 2;
}

message ToneVariationList { repeated string variations = 1; }

// `TpsAdjustResult` carries the adjusted incoming char + an optional
// retroactive `replace_last` instruction for the platform to issue
// `replaceLastCharacter`.
message TpsAdjustResult {
  string adjusted = 1;
  OptionalStringResult replace_last = 2;
}

