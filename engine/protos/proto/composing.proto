syntax = "proto3";

package taigi.engine;

option java_package = "com.siansiansu.taigikeyboard.engine.proto";
option java_multiple_files = true;

import "lexicon.proto";
import "nextword.proto";

// Composing slice — Intent → Effect state machine.
//
// Mirrors the iOS `ComposingState.Intent` / Android `ComposingState.Intent`
// case set 1:1 pre-migration. The Rust crate `engine/composing` owns the
// state (`Phase::Idle | Composing { raw } | Continuous { .. }`)
// inside a singleton `Mutex<Engine>` held by `EngineHandle`.
//
// Naming convention: `oneof method` matches the Phonetics/Lexicon dispatch
// pattern adopted in PR #186.
//
// Lifecycle: every request carries `Request.generation`. A mismatch from the
// engine's last-seen generation drops state to Idle BEFORE applying the
// request (no effects emitted from the drop). See
// `docs/engine/composing-slice-plan.md §5b.2` for the full semantic table.

message ComposingRequest {
  // Tag layout: text-input mutators in 10s, v3.5.8 continuous-input ops in
  // 30s, desktop key ops in 40s. Spacing leaves room for future families
  // without renumbering existing variants.
  //
  // Tags 20 (`set_selected_candidate_index`) and 21 (`query_state`) had no
  // production caller and were removed 2026-09-25.
  reserved 20, 21;
  reserved "set_selected_candidate_index", "query_state";

  oneof method {
    // --- Text-input mutators (10s) ---
    Start                           start                                = 10;
    Append                          append                               = 11;
    AppendHyphen                    append_hyphen                        = 12;
    ReplaceLast                     replace_last                         = 13;
    DeleteBackward                  delete_backward                      = 14;
    CommitDerived                   commit_derived                       = 15;
    CommitRaw                       commit_raw                           = 16;
    SelectSuggestion                select_suggestion                    = 17;
    CommitPreeditThenInsertExternal commit_preedit_then_insert_external  = 18;
    Reset                           reset                                = 19;

    // --- Continuous-input ops (30s, v3.5.8 Phase 6) ---
    EnterContinuous                 enter_continuous                     = 30;
    FetchAtPos                      fetch_at_pos                         = 31;
    CommitContinuous                commit_continuous                    = 32;
    ResetContinuous                 reset_continuous                     = 33;

    // --- Desktop editing keys (40s: Telex tone keys, composing caret) ---
    TelexKey                        telex_key                            = 40;
    MoveCaret                       move_caret                           = 41;
  }
}

// Begin a fresh composition buffer with `text`. Caret resets.
message Start { string text = 1; }

// Append a single character to the buffer. Idle → behaves as Start.
message Append { string char = 1; }

// Convenience alias for `Append("-")`. Kept distinct so call sites do not
// synthesize hyphen strings on the wire.
message AppendHyphen {}

// TPS auto-correct: replace the last raw-input character.
message ReplaceLast { string replacement = 1; }

// Delete one grapheme. Empties → Idle. iOS emits
// `DeleteBackwardFromDocument`; Android wrapper routes 1-char-empty through
// `Reset` instead (`composing-slice-plan.md §5b.1`).
message DeleteBackward {}

// Commit the tone-marked derived form to the document.
message CommitDerived {}

// Commit the literal raw input (bypass tone conversion). Used for
// Enter-at-index-0 / English passthrough.
message CommitRaw {}

// Commit the supplied platform-resolved suggestion text, atomically
// replacing the current preedit.
message SelectSuggestion { string text = 1; }

// Commit the current preedit (if any) and atomically insert externally
// supplied text in one document write. Non-Taigi input surfaces (emoji
// palette, clipboard paste). Idle → behaves as plain insert.
message CommitPreeditThenInsertExternal { string text = 1; }

// Clear all state (mode switch, teardown). User-initiated; emits
// `[ClearPreeditWithoutCommit, ResetAutocomplete]` if was composing,
// `[]` if was Idle.
message Reset {}

// v3.5.8 Phase 6 — transition `Phase::Composing { raw }` → `Phase::Continuous
// { raw, committed: [] }`. No payload: the buffer is already populated by
// prior `Start` / `Append` calls. No-op when state is Idle / Continuous or
// when the existing `Composing.raw` is empty (matches Phase-4 strict
// precondition pinned at `engine/composing/src/transition.rs:484-490`).
// Mode comes from `Request.config_snapshot.input_mode`.
message EnterContinuous {}

// v3.5.8 Phase 6 — Pure read: returns the candidate list for the current
// `Phase::Continuous { raw }` (the whole buffer). The engine builds the
// `(consumed_span, key)` pairs with `composing::shadow::build_continuous_keys`
// — one shadow → lattice path for every mode (the hyphen shadow makes
// `tâi-uân` produce the same `tl:<toneless>` keys as `taiuan`; TPS keys
// come from the same lattice) — and hands them to
// `lexicon::fetch_candidates_for_keys_with_barriers`. Emits no effects.
//
// The user's own rows — learned counts, custom-dictionary matches, learned
// phrases — never ride this message: the engine reads them from its
// user-data stores (`UserDataRequest.open`; user-data-engine-roadmap P9).
//
// `now_ms` is the platform's epoch-ms wall clock at fetch time
// (iOS `Date().timeIntervalSince1970 * 1000`, Android
// `System.currentTimeMillis()`), the clock the recency ranking reads. The
// engine guards against `now_ms <= 0`, `last_used_ms <= 0`, and
// `now_ms < last_used_ms` (clock skew) by falling through to
// `user_weight = 0.0` for every candidate — see
// `engine/ranking/src/score.rs::decayed_user_weight_delta`.
//
// `toggles` are the user's dictionary switches — the same message Tab3
// browse (`DictionaryFiltersRequest`) and `PredictNext` carry. The engine
// resolves them into the source filter itself with the encoder behind
// `DictionaryFilters`, so keyboard candidates honour the same 12 source
// toggles + kautian subcollection toggles as browse and no platform
// computes a bitmask. Absent `toggles` keeps every source on — a default for
// test fixtures, like fields 6 and 8: the engine ships inside each app, so
// no platform build without the field reaches it, and every platform in this
// repository sends them. Toggles with every dictionary off offer no
// dictionary candidates (§57).
//
// §34 / S22 — `literal_roman_candidate_disabled` gates the always-on
// preedit-literal roman candidate (the `derived_display` WYSIWYG row that
// `handle_fetch_at_pos` prepends at index 0 in TL/POJ so Hanji-romanization mixing commits
// the romanization in one tap). It does NOT suppress roman-only / OOV-synth
// candidates that `assemble_candidates` produces naturally — only the §34
// forced prepend.
//
// SENTINEL (inverted, so the un-wired default is the legacy behaviour):
// proto3 default `false` means "show" (= pre-toggle always-on
// behaviour), so older / un-wired builds and proto-decoded fixtures keep the
// candidate. The platform sends `true` only when the user turns the
// Show Typed Text First setting OFF. Platform settings stay positive and ship ON on
// all four platforms (`isLiteralRomanCandidateEnabled` iOS / macOS,
// `literalRomanCandidateEnabled` Android, `is_literal_roman_candidate_enabled`
// Windows); the platform sets `disabled = !enabled` — mobile in
// `ComposingManager`, desktop in the engine bridge.
message FetchAtPos {
  // Was `uint32 position` — always 0, never a partial fetch.
  reserved 1;
  reserved "position";
  // Were the platform-sent user rows (`frequency_entries`, `custom_entries`,
  // `learned_entries`); the engine reads its own stores
  // (user-data-engine-roadmap P9).
  reserved 2, 4, 7;
  reserved "frequency_entries", "custom_entries", "learned_entries";
  // Was the platform-resolved source bitmask (`0` = un-wired, all sources
  // on); the engine resolves `toggles` instead.
  reserved 5;
  reserved "enabled_sources_bitmask";
  int64 now_ms                             = 3;
  bool literal_roman_candidate_disabled    = 6;
  // The user's "use my custom dictionary" setting, OFF: the engine reads no
  // custom-dictionary rows for this fetch. Negative like field 6, so an
  // un-wired build keeps the dictionary on.
  bool custom_dictionary_disabled          = 8;
  DictionarySourceToggles toggles          = 9;
}

// v3.5.8 Phase 6 — commit a candidate segment in `Phase::Continuous`. The
// payload mirrors `Intent::CommitContinuous` (engine-side state machine
// from Phase 4): the engine takes `pending[..consumed_bytes]` as the
// committed segment's raw text and keeps the remainder as the new pending
// tail. `consumed_bytes >= pending.len()` becomes a final commit (exit
// to Idle). Programmer-error inputs (out-of-range / non-char-boundary
// `consumed_bytes`, no `script`, empty `canonical_text`) collapse to noop.
//
// **Platform contract**: when committing the user's tap on a candidate
// returned by `FetchAtPos`, `consumed_bytes` MUST equal the chosen
// `CandidateMessage.consumed_span_end` and `syllable_count` MUST equal
// the chosen `CandidateMessage.syllable_count`. Sending different
// values will mis-align the committed segment with the candidate the
// user saw.
message CommitContinuous {
  // Tag 1 was `display_text` — the document string the platform formatted
  // itself. Every platform names a `script` since R5 and the engine
  // resolves the text; removed 2026-09-30.
  reserved 1;
  reserved "display_text";

  uint32 consumed_bytes = 2;
  uint32 syllable_count = 3;
  // v3.5.8 Phase 9 Bug 1 (Option A). Canonical dictionary key
  // (`hanji.unwrap_or(roman)`) the engine counts the pick under
  // (`user_frequency.db`) and NextWord learns, so learning stays
  // mode-independent. Empty → the commit is IGNORED.
  string canonical_text = 4;
  // v3.6.1 R2 — canonical TL romanization of the committed candidate
  // (`CandidateMessage.canonical_tl`, snapshotted BEFORE the POJ-render /
  // recase passes rewrite `roman`). Becomes the `roman` arg of the
  // NextWord `WordSelected` / `UpdateLastSelectedWord` effects so the
  // learned association `prev_tl` / `next_tl` is the same canonical TL a
  // normal (non-continuous) candidate commit records — fixing the
  // continuous-vs-normal `next_tl` fragmentation (raw typed slice
  // `taigi` vs canonical `tâi-gí`). Wire-absent / empty (legacy callers,
  // the other 12 methods, TPS-OOV hanji-absent candidates with no dict
  // TL) decodes as "" → engine falls back to the raw committed slice
  // (`pending[..consumed_bytes]`), preserving pre-R2 behavior. Identity
  // is the `(hanji, canonical-TL)` pair (Core Principle #7), so this is
  // populated for hanji-present candidates too, NOT only hanji-absent.
  string association_tl = 5;
  // Learned phrases (§50) — the chosen `CandidateMessage.hanji`, sent
  // whenever the picked candidate carries hanji regardless of which script
  // the document received (identity = the `(Hanji, canonical-TL)` pair, Core
  // Principle #6; a Hanji with Romanization roman cell commits the same candidate). Wire-absent
  // for a hanji-less pick (§34 literal, OOV synth, roman-only custom row)
  // and for legacy callers; a composition with any hanji-less segment is
  // never learned. proto3 `optional` so absent ≠ empty (Codex 2026-09-20
  // F2: hanji is an explicit sidechannel, never inferred from
  // `canonical_text` vs `association_tl`).
  optional string hanji = 6;
  // R5 — engine-owned commit resolution: the engine resolves the document
  // text from `roman`, `hanji` and the request's `AppConfig`
  // (`composing::commit_text`), answers `ComposingResponse.commit`, and —
  // with the user-data stores open — records the pick's usage itself (the
  // platform sends no `RecordUsage` for it). `UNSPECIFIED` (or a script
  // newer than the engine) is IGNORED. On the TPS layout the romanization
  // written renders as Bopomofo.
  CommitScript script = 7;
  // The pick's `CandidateMessage.roman`, as the candidate carried it (POJ-
  // rendered / recased / No Hyphens — the display romanization, never the
  // canonical TL).
  string roman = 8;
}

// Which rendering of the picked candidate the document gets (R5).
enum CommitScript {
  COMMIT_SCRIPT_UNSPECIFIED = 0;  // no script: the commit is ignored
  COMMIT_SCRIPT_LEAD        = 1;  // what the output settings lead with (Enter / a tap)
  COMMIT_SCRIPT_OTHER       = 2;  // the other script of the lead (desktop Space)
  COMMIT_SCRIPT_HANJI       = 3;  // a §42 split Hanji cell
  COMMIT_SCRIPT_ROMAN       = 4;  // a §42 split romanization cell
}

// What a `CommitContinuous` did (R5) — replaces the platforms' effect scans.
message CommitResolution {
  CommitOutcome outcome   = 1;
  // The text this pick wrote into the composition — the segment, not the
  // whole finalized composition. Empty when IGNORED.
  string document_text    = 2;
  // `document_text` carries romanization (behavioral-invariants §23).
  bool wrote_romanization = 3;
  // FINALIZED && wrote_romanization && `document_text` does not end in `-`.
  // The platform still ANDs its live Auto-Space setting.
  bool earns_auto_space   = 4;
}

enum CommitOutcome {
  COMMIT_OUTCOME_UNSPECIFIED = 0; // never emitted
  COMMIT_OUTCOME_NAILED      = 1;  // mid-commit: the composition continues
  COMMIT_OUTCOME_FINALIZED   = 2;  // the buffer was consumed; the engine is Idle
  COMMIT_OUTCOME_IGNORED     = 3;  // nothing changed (stale generation, rejected pick)
}

// v3.5.8 Phase 6 — abort continuous-input. Drops `Phase::Continuous`
// committed list and pending raw, exits to Idle, and emits the standard
// abort effect trio (`ClearPreeditWithoutCommit` + `ResetAutocomplete` +
// `NextWordClearForNewComposing`). Committed segments stay in the
// document (already inserted via earlier `CommitTextReplacingPreedit`
// effects).
message ResetContinuous {}

// Desktop Telex scheme: one key from `x v y d w q` (tones 1/4 2/8 3 5 7 9 —
// `x` and `v` write the checked tone after a stop coda `p t k h`, the open
// tone otherwise), `z` (affricate initial `ts` / `ch` by
// `AppConfig.input_mode`) or `f` (hyphen), either case. The engine edits the
// pending tail — appending or replacing the trailing tone digit — and keeps
// the buffer numeric-tone.
// A key that changes nothing (same tone twice, tone on an empty tail) is a
// no-op. Idle + `z` enters composing with the expansion.
message TelexKey { string key = 1; }

// Desktop only — step the caret inside the pending tail one Unicode scalar
// value left or right (`⌥←` / `⌥→` on macOS, `Ctrl+←` / `Ctrl+→` on Windows). The
// buffer does not change, so the response carries `UpdatePreedit` (with the
// new `caret_utf16`) and NO `PerformAutocomplete`: candidates, highlight and
// page stay. At either edge of the pending tail — the caret never enters a
// nailed segment — the request is a no-op with no effects. Every mutator
// then edits at the caret: `Append` inserts there, `DeleteBackward` /
// `ReplaceLast` act on the character before it, `TelexKey` on the chunk
// before it. Mobile never sends this, so its caret stays at the end and
// every mutator behaves as before.
message MoveCaret { CaretDirection direction = 1; }

enum CaretDirection {
  CARET_DIRECTION_UNSPECIFIED = 0;  // treated as a no-op
  CARET_DIRECTION_LEFT        = 1;
  CARET_DIRECTION_RIGHT       = 2;
}

message ComposingResponse {
  message Preedit {
    string raw_input    = 1;  // numeric tone, ASCII (search key)
    string display_text = 2;  // diacritics (UI)
    // Where the caret sits inside `display_text`, as a UTF-16 offset — the
    // unit `setMarkedText(selectionRange:)` and `ITfRange::ShiftEnd` take.
    // Equals the UTF-16 length of `display_text` unless a desktop moved the
    // caret (`MoveCaret`). Idle → 0.
    uint32 caret_utf16  = 3;
  }

  // Tag 3 was `selected_candidate_index` — always `is_composing ? 0 : -1`
  // once `SetSelectedCandidateIndex` was removed; candidate highlight is
  // platform-owned. Removed 2026-09-25.
  reserved 3;
  reserved "selected_candidate_index";

  Preedit preedit                = 1;
  repeated Effect effect         = 2;  // ordered side effects; prost preserves order
  bool is_composing              = 4;  // mirrors `state.isComposing`

  // v3.5.8 Phase 6 — continuous-input candidate carrier. Populated only by
  // `FetchAtPos` (other continuous methods leave it absent: state-changing
  // ops emit Effects, and the platform follows up with `FetchAtPos` to
  // refresh the candidate strip — keeps each RPC single-purpose). Optional
  // at the wire level: every other method leaves it absent (proto3 zero-
  // default safe). Pending-display text is NOT duplicated here — it is
  // already in `preedit.display_text` for `Phase::Continuous`.
  optional ContinuousResponse continuous = 5;

  // R5 — set by every `CommitContinuous`; absent for every other request.
  optional CommitResolution commit = 6;
}

// v3.5.8 Phase 6 — payload for `FetchAtPos` responses. Carries the
// span-local candidates `lexicon::fetch_candidates_for_keys_with_barriers`
// produced from the `composing::shadow::build_continuous_keys` keys (every
// mode) for the current `Phase::Continuous { raw }`; the
// `fetch_candidates_for_endings` helper lives in the lexicon tests only.
message ContinuousResponse {
  repeated CandidateMessage candidates = 1;
}

// v3.5.8 Phase 9.2 — candidate-type discriminator. MOE `VocType`
// (`VT_HANT` / `VT_TAILO` / `VT_MIXED`) is the cite. Derived in Rust
// from `DictionaryRecord.hanji` presence + NFKD-normalized Latin-letter
// detection; see `engine/lexicon/src/continuous/mod.rs::derive_mode`.
//
// Metadata-only: this field does NOT enter the `CandidateSortKey` tie-break
// in v3.5.8 (per `docs/releases/v3.5.8/plan.md` § Phase 9 R2 Q3.a — "reserve rank
// use until real collisions are measured"). It is orthogonal to the
// existing `form` axis (toneless / numeric / hanji / abbrev).
//
// `UNSPECIFIED = 0` is the proto3 default and never emitted by Rust;
// platforms must treat `UNSPECIFIED` as "unknown carrier — fall back
// to display-text sniff" rather than as HANT.
enum CandidateMode {
  CANDIDATE_MODE_UNSPECIFIED = 0;
  CANDIDATE_MODE_HANT        = 1;
  CANDIDATE_MODE_TAILO       = 2;
  CANDIDATE_MODE_MIXED       = 3;
}

// v3.5.8 Phase 6 — single span-local continuous candidate. Wire mirror of
// `lexicon::RawCandidate` (`engine/lexicon/src/continuous/`).
//
// `consumed_span` is encoded as two scalar fields rather than a nested
// message to keep wire overhead low. `consumed_span_start` /
// `consumed_span_end` are byte offsets in the **original raw user
// input** stored in `Phase::Continuous { raw }` — not in any canonical
// TL transform. TL / POJ users → ASCII bytes; TPS users → Bopomofo
// bytes (Phase 6 dispatcher converts TPS spans to canonical TL FST
// keys for lookup but emits the span back in the user-facing TPS byte
// space). Platform UI slices `pending[start..end]` off
// `Phase::Continuous { raw }` (or its preedit mirror) on commit.
//
// `form` is currently always `1` (FORM_NOTONE; see
// `engine/lexicon/src/continuous/`); reserved for hanji (0) /
// numeric (2) / abbrev (3) when proto-side carriers exist.
//
// `mode` (Phase 9.2) is the MOE-aligned candidate-type discriminator;
// see `CandidateMode` above.
//
// v3.5.8 Phase 9 Item 5 — `roman` + `hanji` are display-only
// sidechannels added so platform UI can build dual-line cells
// (roman / hanji) the same way the legacy lexicon path does. The
// engine continues to authority-stamp commit semantics and
// `user_frequency.db` write keys via `display_text`
// (= `hanji.unwrap_or(roman)`; under a single-script display the §34
// literal carries the identity of the same-roman dictionary row it
// absorbed — `composing::requests::adopt_collapsed_dict_identity`);
// `roman` and `hanji` are NEVER read for commit. `roman` is the display romanization for the active
// input mode — the underlying `DictionaryRecord.tl` by default, or
// POJ-display (`oo`→`o͘`, `nn`→`ⁿ`, …) when
// `AppConfig.input_mode = poj` (engine-rendered, mirroring the
// dictionary-search path); `hanji` mirrors `DictionaryRecord.hanji`
// (proto3 `optional` distinguishes "TAILO candidate — no hanji
// exists" from "wire-frame defect"). See
// `docs/engine/continuous-candidate-display.md` §4 for the full
// rationale and `docs/engine/continuous-input-ranking.md` §10.11
// for the companion ranker dedupe rule.
message CandidateMessage {
  uint32         consumed_span_start = 1;
  uint32         consumed_span_end   = 2;
  uint32         syllable_count      = 3;
  string         display_text        = 4;
  float          score               = 5;
  uint32         form                = 6;
  CandidateMode  mode                = 7;
  string         roman               = 8;
  optional string hanji              = 9;
  // v3.6.1 R2 — canonical TL romanization (identity sidechannel). Unlike
  // `roman` (field 8, the DISPLAY romanization — POJ-rendered in POJ mode,
  // recased per the typed segment), this stays the canonical TL the
  // `(hanji, canonical-TL)` word identity is keyed on (Core Principle #7):
  // `DictionaryRecord.tl` for dict-backed candidates, or
  // `phonetics::api::canonical_tl_form(native_roman, mode)` for
  // custom / walker-synth candidates. Snapshotted at candidate
  // construction, BEFORE the composing recase / POJ-render passes touch
  // `roman`. The platform round-trips it back via
  // `CommitContinuous.association_tl` so the NextWord association learns
  // the same TL a normal candidate commit would. Empty iff no canonical
  // TL is recoverable (TPS-OOV hanji-absent) — platform then omits
  // `association_tl` and the engine falls back to the raw committed slice.
  // NEVER consulted for the document commit (that goes through
  // `display_text`).
  string         canonical_tl        = 10;
}

// Platform-neutral effects. The wrapper maps document-mutation effects
// (`UpdatePreedit` / `ClearPreeditWithoutCommit` / `CommitTextReplacingPreedit`
// / `DeleteBackwardFromDocument`) to `setComposingText` / `commitText` /
// `deleteSurroundingText` (Android) or `setMarkedText` / `clearMarkedText` +
// `insertText` (iOS). Autocomplete-control effects (`ResetAutocomplete` /
// `PerformAutocomplete` / `ResetAutocompleteContext`) route to the platform
// autocomplete subsystem (stays platform-side until v3.5.5 NextWord slice).
//
// `NextWord*` effects (tags 8/9/10) are Phase 4 continuous-input handshake.
// The platform FFI shim translates each to a `NextWordRequest` and dispatches
// via `nextword::EngineHandle::instance().handle(req, config, generation)`,
// injecting the current `now_ms` clock at dispatch time (composing engine has
// no clock and emits effects without timestamps). This preserves the
// `composing/handle.rs:54-58` lock-order rule — composing's `Mutex<Engine>`
// is released before the platform makes the nextword call.
message Effect {
  // Was `PhraseLearned`: a learned phrase is kept by the engine itself
  // (user-data-engine-roadmap P9a).
  reserved 11;
  reserved "phrase_learned";
  oneof kind {
    UpdatePreedit                  update_preedit                       = 1;
    ClearPreeditWithoutCommit      clear_preedit_without_commit         = 2;
    CommitTextReplacingPreedit     commit_text_replacing_preedit        = 3;
    DeleteBackwardFromDocument     delete_backward_from_document        = 4;
    ResetAutocomplete              reset_autocomplete                   = 5;
    PerformAutocomplete            perform_autocomplete                 = 6;
    ResetAutocompleteContext       reset_autocomplete_context           = 7;
    NextWordUpdateLastSelectedWord next_word_update_last_selected_word  = 8;
    NextWordWordSelected           next_word_word_selected              = 9;
    NextWordClearForNewComposing   next_word_clear_for_new_composing    = 10;
  }
}

// `caret_utf16` mirrors `Preedit.caret_utf16` for the same composition.
message UpdatePreedit              { string display = 1; uint32 caret_utf16 = 2; }
message ClearPreeditWithoutCommit  {}
message CommitTextReplacingPreedit { string text = 1; }
message DeleteBackwardFromDocument {}
message ResetAutocomplete          {}
message PerformAutocomplete        {}
message ResetAutocompleteContext   {}

// Mid-commit handshake during continuous-input. Maps to
// `NextWordRequest::UpdateLastSelectedWord(text, roman, now_ms)` on the
// platform side. `text` is the committed segment's display (e.g., "紙"),
// `roman` is the segment's raw input (e.g., "tsua"). Emitted inside
// `Phase::Continuous` mid-commit branches (a nail) and on unnail. NextWord
// learns nothing from it — a nailed segment is not in the document yet;
// the final commit's `NextWordWordSelected.preceding` carries it
// (behavioral-invariants §40). Platforms read it as the nail signal.
message NextWordUpdateLastSelectedWord { string text = 1; string roman = 2; }

// Final-commit handshake during continuous-input. Maps to
// `NextWordRequest::WordSelected(text, roman, require_roman_mode=false,
// trigger_prediction, now_ms, preceding)`. Emitted when `Phase::Continuous`
// exits to Idle through commit (pending consumed in full). `preceding` = the
// nailed segments committed before the terminal word, in document order —
// forwarded verbatim so NextWord learns the whole sequence in one decision.
message NextWordWordSelected {
  string                 text               = 1;
  string                 roman              = 2;
  bool                   trigger_prediction = 3;
  repeated CommittedWord preceding          = 4;
}

// Continuous-input abort. Maps to
// `NextWordRequest::ClearForNewComposing(now_ms)`. Emitted when
// `ResetContinuous` / `Reset` / empty-buffer `DeleteBackward` exits
// `Phase::Continuous` without committing.
message NextWordClearForNewComposing {}
