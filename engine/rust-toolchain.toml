[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "minimal"
# JUSTIFICATION: shipped-ABI scope. Apple targets cover the iOS device +
# simulator triples. The macOS archive is built from the `macos/` workspace,
# whose own `macos/rust-toolchain.toml` declares both darwin targets. Android ships arm64-v8a + armeabi-v7a
# (`abiFilters` in android/app/build.gradle.kts, the ABI list in
# engine/scripts/build-android-libs.sh — armv7 returned in v3.5.7 for 32-bit ARM
# devices). Deliberately omitted: the x86 / x86_64 Android targets (no emulator
# ABI ships; build-android-libs.sh refuses an x86 `abiFilters` entry). Engine-only
# work on Linux or Windows can skip every cross target with RUSTUP_TOOLCHAIN=stable.
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
]
